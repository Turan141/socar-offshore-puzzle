<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">

<title>SOCAR Offshore Puzzle</title>

<style>
  /* Landscape 16:9 stand / tablet layout (designed at 1920x1080). 1rem = 1/54 of height. */
  :root{
    --socar-blue:#0085ca;--socar-red:#e4002b;--socar-green:#009639;
    --cyan:#29d3ff;--line:rgba(255,255,255,.14);--good:#3fe28a;--bad:#ff5a4e;--gold:#ffc23d;
    --side:27.5rem;--gap:1.2rem;
  }
  html{font-size:min(calc(100vh / 54),calc(100vw / 96))}
  html,body{margin:0;height:100%;overflow:hidden;background:#0d2330;font-family:Montserrat,"Segoe UI",Arial,sans-serif;color:#fff;
            user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
  button{font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  #c{display:block;width:100%;height:100%;outline:none;touch-action:none}
  .glass{background:linear-gradient(175deg,rgba(7,26,38,.90),rgba(4,16,25,.92));border:1px solid var(--line);
         box-shadow:0 .6rem 1.8rem rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.10)}

  /* top HUD over play area */
  .hud-top{position:fixed;left:0;right:calc(var(--side) + var(--gap) * 2);top:0;display:flex;align-items:center;gap:1.2rem;
           padding:var(--gap) 1.6rem;pointer-events:none;background:linear-gradient(rgba(3,12,18,.52),rgba(3,12,18,0))}
  .timer{display:flex;align-items:center;gap:.7rem;padding:.45rem 1.2rem .45rem .55rem;border-radius:3rem;flex:none}
  .timer svg{width:3rem;height:3rem;transform:rotate(-90deg)}
  .timer .trk{fill:none;stroke:rgba(255,255,255,.14);stroke-width:4}
  .timer .ring{fill:none;stroke:var(--cyan);stroke-width:4;stroke-linecap:round;stroke-dasharray:119.4;transition:stroke .3s}
  #timer{font-size:2rem;font-weight:800;letter-spacing:.05rem;font-variant-numeric:tabular-nums}
  .timer.warn .ring{stroke:var(--bad)} .timer.warn #timer{color:var(--bad);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.55}}
  #title{flex:1;text-align:center;font-size:1.45rem;font-weight:900;letter-spacing:.09rem;padding-right:4rem;
         text-shadow:0 0 1rem rgba(41,211,255,.35),0 .1rem .3rem rgba(0,0,0,.65)}

  /* side tray */
  #tray{position:fixed;top:var(--gap);right:var(--gap);bottom:var(--gap);width:var(--side);box-sizing:border-box;border-radius:1.4rem;
        display:flex;flex-direction:column;padding:1.05rem 1.05rem 1.05rem;gap:.75rem;transition:opacity .4s,transform .4s;z-index:4}
  body[data-state=win] #tray,body[data-state=lose] #tray{opacity:0;transform:translateX(2rem);pointer-events:none}
  .brand{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:0 .15rem .7rem;border-bottom:1px solid var(--line)}
  .brand-id{display:flex;align-items:center;gap:.6rem}
  .brand-logo{height:2.6rem;width:auto;display:block;filter:drop-shadow(0 .15rem .3rem rgba(0,0,0,.45))}   /* official SOCAR logo, white wordmark for dark UI */
  .brand-txt{display:flex;flex-direction:column;line-height:1}
  .brand-txt b{font-weight:900;font-size:1.45rem;letter-spacing:.14rem}
  .brand-txt small{font-size:.55rem;font-weight:700;letter-spacing:.18rem;color:var(--cyan);opacity:.88;margin-top:.22rem}
  .lang-pill{display:inline-flex;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:1.6rem;padding:.18rem;gap:.15rem}
  .lang-pill button{border:0;background:transparent;font-size:.68rem;font-weight:800;letter-spacing:.08rem;padding:.34rem .62rem;border-radius:1.3rem;cursor:pointer;opacity:.68;transition:background .15s,opacity .15s,color .15s}
  .lang-pill button.on{background:var(--socar-blue);color:#fff;opacity:1;box-shadow:0 .15rem .45rem rgba(0,133,202,.4)}

  .side-head{display:flex;align-items:center;justify-content:space-between;padding:0 .2rem}
  .side-head span{font-size:.78rem;font-weight:800;letter-spacing:.18rem;opacity:.82}
  #dots{display:flex;gap:.32rem}
  #dots i{width:1.25rem;height:.38rem;border-radius:.2rem;background:rgba(255,255,255,.18);transition:background .3s,box-shadow .3s}
  #dots i.on{background:var(--cyan);box-shadow:0 0 .5rem var(--cyan)}
  #cards{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,minmax(0,1fr));gap:.72rem;min-height:0;padding-top:.35rem}
  .card{position:relative;border-radius:1rem;box-sizing:border-box;padding:.22rem .35rem .30rem;cursor:pointer;touch-action:none;
        background:linear-gradient(165deg,rgba(14,42,60,.82),rgba(6,19,29,.88));border:.1rem solid rgba(118,178,214,.22);
        display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .15s,border-color .15s,box-shadow .15s,opacity .15s}
  .card canvas.thumb{width:min(8.5rem,78%);aspect-ratio:1;filter:drop-shadow(0 .24rem .38rem rgba(0,0,0,.62));pointer-events:none}
  .card span.cname{font-size:.70rem;font-weight:700;margin-top:.06rem;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:center}
  .card-mini{position:absolute;top:.42rem;left:.44rem;display:grid;gap:2px;pointer-events:none;opacity:.96;
             background:rgba(4,16,24,.78);padding:3.5px;border-radius:.34rem;border:1px solid rgba(255,255,255,.16);z-index:1}
  .card-mini i{display:block;width:.52rem;height:.52rem;border-radius:2px;box-sizing:border-box}
  .card-code{position:absolute;top:.42rem;right:.46rem;font-size:.64rem;font-weight:900;letter-spacing:.04rem;
             padding:.1rem .38rem;border-radius:.32rem;background:rgba(4,16,24,.72);border:1px solid rgba(255,255,255,.18);
             color:#e9f6ff;pointer-events:none;z-index:1}
  .card.sel{border-color:var(--cyan);background:linear-gradient(160deg,rgba(0,133,202,.32),rgba(41,211,255,.07));
            box-shadow:0 0 0 .18rem rgba(41,211,255,.22),0 .5rem 1.2rem rgba(0,133,202,.3)}
  .card.sel::after{content:attr(data-sel-label);position:absolute;top:-.55rem;left:50%;transform:translateX(-50%);background:var(--cyan);color:#04202d;
            font-size:.54rem;font-weight:900;letter-spacing:.06rem;padding:.12rem .55rem;border-radius:.6rem;white-space:nowrap}
  .card.lifted{opacity:.32;transform:scale(.94)}
  .card:active{transform:scale(.96)}

  .side-hint{display:flex;align-items:center;gap:.55rem;font-size:.74rem;font-weight:600;opacity:.72;padding:0 .15rem;line-height:1.28}
  .side-hint svg{width:1.5rem;height:1.5rem;flex:none}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
  .act{height:4.3rem;border-radius:1rem;border:.1rem solid rgba(255,255,255,.18);cursor:pointer;
       background:linear-gradient(#244252,#142a37);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;
       font-size:.9rem;font-weight:800;letter-spacing:.04rem;box-shadow:0 .28rem 0 #091720,inset 0 1px 0 rgba(255,255,255,.12);transition:transform .08s,box-shadow .08s}
  .act svg{width:1.6rem;height:1.6rem}
  .act:active{transform:translateY(.22rem);box-shadow:0 .06rem 0 #091720}
  .act.rot{background:linear-gradient(#0085ca,#005a8c);border-color:rgba(41,211,255,.55)}
  .act:disabled{opacity:.35}

  #info{position:fixed;left:var(--gap);bottom:var(--gap);font-size:.55rem;opacity:.45;pointer-events:none;display:none}
  #fps{position:fixed;left:.5rem;bottom:2rem;font:600 11px/1.4 Consolas,monospace;background:rgba(0,0,0,.65);padding:4px 8px;border-radius:6px;display:none;z-index:9}
  #toast{position:fixed;left:calc((100vw - var(--side) - var(--gap) * 2) / 2);bottom:2.4rem;transform:translate(-50%,1rem);padding:.6rem 1.25rem;
         border-radius:2rem;font-weight:700;font-size:.98rem;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;z-index:8}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.bad{border-color:rgba(255,90,78,.65);color:#ffd9d6}
  #toast.good{border-color:rgba(63,226,138,.65);color:#d8ffe9}

  /* screens */
  #screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;transition:background .3s;z-index:10}
  #screen.dim{background:radial-gradient(ellipse at center,rgba(4,14,22,.38),rgba(3,11,18,.84))}
  #screen.hidden{display:none}
  #screen.compact{justify-content:flex-end;padding-right:var(--gap);pointer-events:none;box-sizing:border-box}
  #screen.compact .panel{pointer-events:auto;width:var(--side)}
  .panel.glass{background:linear-gradient(170deg,rgba(11,36,52,.94),rgba(5,17,26,.96));border-color:rgba(41,211,255,.32)}
  .panel{position:relative;width:44rem;max-width:94vw;box-sizing:border-box;padding:1.75rem 2.2rem 1.55rem;border-radius:1.6rem;text-align:center;
         animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:scale(.88);opacity:0}}
  .panel-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.65rem}
  .panel-brand{display:flex;align-items:center;gap:.55rem}
  .panel-brand svg{height:2.3rem;width:auto;display:block}
  .panel-brand span{font-size:.74rem;font-weight:900;letter-spacing:.2rem;color:var(--cyan)}
  .eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.22rem;color:var(--cyan);margin-bottom:.35rem}
  .panel h1{margin:0 0 .5rem;font-size:2.2rem;font-weight:900;letter-spacing:.04rem;line-height:1.12}
  .panel p{margin:0 auto 1.1rem;max-width:34rem;font-size:.94rem;font-weight:500;opacity:.84;line-height:1.42}

  .tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:1.1rem}
  .tier-btn{border-radius:.95rem;border:1px solid var(--line);background:rgba(255,255,255,.05);padding:.7rem .5rem;cursor:pointer;
            display:flex;flex-direction:column;align-items:center;gap:.2rem;transition:border-color .15s,background .15s,transform .1s}
  .tier-btn b{font-size:.9rem;font-weight:800}
  .tier-btn small{font-size:.68rem;font-weight:600;opacity:.7}
  .tier-btn.on{border-color:var(--cyan);background:linear-gradient(160deg,rgba(0,133,202,.34),rgba(41,211,255,.08));
               box-shadow:0 0 0 .15rem rgba(41,211,255,.22)}
  .tier-btn:active{transform:scale(.97)}

  .steps{display:flex;gap:.7rem;justify-content:center;margin-bottom:1.1rem}
  .step{flex:1;padding:.8rem .55rem .72rem;border-radius:1rem;background:rgba(255,255,255,.05);border:1px solid var(--line)}
  .step i{display:flex;align-items:center;justify-content:center;width:2rem;height:2rem;margin:0 auto .4rem;border-radius:50%;
          background:rgba(41,211,255,.16);color:var(--cyan);font-style:normal;font-weight:900;font-size:.95rem}
  .step b{display:block;font-size:.88rem;margin-bottom:.12rem}
  .step span{font-size:.68rem;opacity:.68;line-height:1.25;display:block}

  /* daily stand leaderboard */
  .lb-box{margin:0 0 1.15rem;padding:.7rem .9rem;border-radius:1rem;background:rgba(4,16,24,.55);border:1px solid var(--line);text-align:left}
  .lb-head{display:flex;align-items:center;justify-content:space-between;font-size:.66rem;font-weight:800;letter-spacing:.14rem;color:var(--cyan);margin-bottom:.42rem;text-transform:uppercase}
  .lb-list{display:flex;flex-direction:column;gap:.26rem}
  .lb-row{display:flex;align-items:center;justify-content:space-between;font-size:.78rem;font-weight:700;padding:.24rem .45rem;border-radius:.45rem;background:rgba(255,255,255,.04)}
  .lb-row.me{background:rgba(41,211,255,.18);border:1px solid rgba(41,211,255,.45)}
  .lb-row .lb-r{display:flex;align-items:center;gap:.55rem}
  .lb-row .lb-rank{width:1.2rem;opacity:.6;font-variant-numeric:tabular-nums}
  .lb-row .lb-tag{letter-spacing:.12rem;font-weight:800}
  .lb-row .lb-time{font-variant-numeric:tabular-nums;color:var(--good)}
  .lb-empty{font-size:.75rem;opacity:.55;text-align:center;padding:.25rem 0}

  /* touch-friendly 3-letter callsign entry (no OS virtual keyboard) */
  .tag-entry{display:flex;flex-direction:column;align-items:center;gap:.5rem;margin-bottom:1.05rem;padding:.75rem .9rem;border-radius:1rem;
             background:rgba(255,255,255,.05);border:1px solid var(--line)}
  .tag-entry-lbl{font-size:.68rem;font-weight:800;letter-spacing:.14rem;opacity:.8;text-transform:uppercase}
  .tag-row{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;justify-content:center}
  .slot{display:flex;flex-direction:column;align-items:center;gap:.18rem}
  .slot button{width:2.5rem;height:1.45rem;border-radius:.4rem;border:1px solid var(--line);background:rgba(255,255,255,.09);cursor:pointer;
               font-size:.65rem;font-weight:900;display:flex;align-items:center;justify-content:center}
  .slot button:active{background:var(--socar-blue)}
  .slot b{width:2.5rem;height:2.2rem;border-radius:.48rem;background:#081c28;border:1px solid rgba(41,211,255,.45);display:flex;align-items:center;justify-content:center;
          font-size:1.25rem;font-weight:900;color:var(--cyan)}
  .presets{display:flex;gap:.32rem}
  .preset-btn{border:1px solid var(--line);background:rgba(255,255,255,.07);border-radius:.5rem;padding:.34rem .5rem;font-size:.68rem;font-weight:800;cursor:pointer}
  .preset-btn:active{background:var(--socar-blue)}
  .save-btn{height:2.4rem;padding:0 1rem;border-radius:.7rem;border:0;background:linear-gradient(#3fe28a,#1db964);color:#042414;font-weight:900;font-size:.78rem;letter-spacing:.08rem;cursor:pointer}
  .save-btn:disabled{opacity:.45;cursor:default}

  .btn-main{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;min-width:16rem;height:3.85rem;padding:0 2rem;border-radius:2rem;
            border:0;cursor:pointer;font-size:1.2rem;font-weight:900;letter-spacing:.12rem;color:#fff;
            background:linear-gradient(#12a3e8,#0073b0);box-shadow:0 .32rem 0 #00456b,0 .6rem 1.6rem rgba(0,133,202,.42);transition:transform .08s,box-shadow .08s}
  .btn-main:active{transform:translateY(.26rem);box-shadow:0 .06rem 0 #00456b}
  .btn-main.pulse{animation:breathe 1.6s infinite}
  @keyframes breathe{50%{box-shadow:0 .32rem 0 #00456b,0 .6rem 2.5rem rgba(41,211,255,.65)}}
  .tap-any{margin-top:.65rem;font-size:.72rem;opacity:.55}
  .badge{width:4.6rem;height:4.6rem;margin:-4rem auto .65rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.2rem;font-weight:900}
  .badge.win{background:radial-gradient(circle at 35% 30%,#7dffbf,#16b866);box-shadow:0 0 0 .45rem rgba(63,226,138,.18),0 .6rem 1.8rem rgba(63,226,138,.45)}
  .badge.lose{background:radial-gradient(circle at 35% 30%,#ff9b8f,#d6372b);box-shadow:0 0 0 .45rem rgba(255,90,78,.18),0 .6rem 1.8rem rgba(255,90,78,.45)}
  .stars{display:flex;gap:.55rem;justify-content:center;align-items:flex-end;margin:.2rem 0 .9rem}
  .stars i{font-style:normal;font-size:2.5rem;line-height:1;color:rgba(255,255,255,.15);transform:scale(.4);opacity:0;animation:star .45s cubic-bezier(.2,1.6,.4,1) forwards}
  .stars i.on{color:var(--gold);text-shadow:0 0 1rem rgba(255,194,61,.7)}
  .stars i:nth-child(2){animation-delay:.18s;font-size:3.2rem}.stars i:nth-child(3){animation-delay:.36s}
  @keyframes star{to{transform:scale(1);opacity:1}}
  .stats{display:flex;gap:.65rem;margin-bottom:1rem}
  .stats div{flex:1;padding:.68rem .4rem;border-radius:.9rem;background:rgba(255,255,255,.06);border:1px solid var(--line)}
  .stats b{display:block;font-size:1.55rem;font-weight:900;font-variant-numeric:tabular-nums}
  .stats span{font-size:.6rem;font-weight:600;opacity:.68;text-transform:uppercase;letter-spacing:.06rem}
  .auto{margin-top:.75rem;font-size:.7rem;opacity:.55}
  .panel.small{padding:1.4rem 1.5rem 1.2rem}
  .panel.small h1{font-size:1.75rem}
  .panel.small .badge{width:3.6rem;height:3.6rem;font-size:1.7rem;margin:-3rem auto .5rem}
  .panel.small p{margin-bottom:1rem;font-size:.88rem}
  .panel.small .stats{margin-bottom:1.1rem}.panel.small .stats b{font-size:1.4rem}
  .panel.small .btn-main{min-width:0;width:100%;font-size:1.05rem;height:3.6rem}

  /* hint button */
  #hintBtn{display:none;height:3.1rem;border-radius:1rem;border:.1rem solid rgba(255,194,61,.65);cursor:pointer;
           background:linear-gradient(#5a4512,#3a2c0b);color:#ffe2a0;font-size:.92rem;font-weight:800;letter-spacing:.06rem;
           align-items:center;justify-content:center;gap:.48rem;animation:glow 1.8s infinite}
  #hintBtn.show{display:flex}
  #hintBtn svg{width:1.35rem;height:1.35rem}
  @keyframes glow{50%{box-shadow:0 0 1.4rem rgba(255,194,61,.45)}}

  /* tutorial hand */
  #hand{position:fixed;left:0;top:0;width:4.4rem;height:4.4rem;pointer-events:none;z-index:6;opacity:0;filter:drop-shadow(0 .3rem .5rem rgba(0,0,0,.55))}
  #hand.run{animation:handmove 2.6s ease-in-out infinite}
  @keyframes handmove{
    0%{transform:translate(var(--x0),var(--y0)) scale(1);opacity:0}
    12%{transform:translate(var(--x0),var(--y0)) scale(.86);opacity:1}
    72%{transform:translate(var(--x1),var(--y1)) scale(.86);opacity:1}
    86%{transform:translate(var(--x1),var(--y1)) scale(1);opacity:1}
    100%{transform:translate(var(--x1),var(--y1)) scale(1);opacity:0}}
  #dragIcon,.flyback{position:fixed;left:0;top:0;width:5rem;height:5rem;pointer-events:none;z-index:7;filter:drop-shadow(0 .4rem .6rem rgba(0,0,0,.55))}
  #dragIcon{display:none}
  .flyback{transition:transform .35s cubic-bezier(.4,0,.2,1),opacity .35s}
  .card.shake{animation:cshake .4s}
  @keyframes cshake{20%,60%{transform:translateX(-.4rem)}40%,80%{transform:translateX(.4rem)}}

  /* staff menu */
  #staffHot{position:fixed;left:0;top:0;width:8rem;height:5.5rem;z-index:12}
  #staff{position:fixed;inset:0;z-index:15;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.62)}
  #staff.show{display:flex}
  #staff .box{width:32rem;padding:1.5rem;border-radius:1.4rem;display:grid;gap:.65rem;box-sizing:border-box}
  #staff h3{margin:0 0 .15rem;font-size:1rem;letter-spacing:.18rem;color:var(--cyan)}
  #staff .meta{font-size:.72rem;opacity:.75;background:rgba(255,255,255,.05);padding:.5rem .7rem;border-radius:.6rem;font-family:Consolas,monospace}
  #staff button{height:3.25rem;border-radius:.8rem;border:1px solid var(--line);background:#1b3848;font-size:.95rem;font-weight:700;cursor:pointer}
  #staff .row{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}
  #staff .danger{background:#5c2222;border-color:rgba(255,90,78,.4)}
  #staff .close{background:#00699e}

  /* portrait guard */
  #portrait{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;
            background:#0b1d26;font-size:5vw;font-weight:800;text-align:center;padding:0 8vw}
  #portrait svg{width:22vw;height:22vw;animation:turn 2s ease-in-out infinite}
  @keyframes turn{40%,60%{transform:rotate(-90deg)}}
  @media (orientation:portrait){#portrait{display:flex}}
</style>

const SHAPES = {

const TYPE_W = { I3: 0.7, I4: 0.8, O: 0.7, T: 1.2, L: 1.2, J: 1.2, S: 1, Z: 1, V: 0.6 };

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function normalize(cells) {
  let mx = Infinity, my = Infinity;
  for (const [x, y] of cells) { if (x < mx) mx = x; if (y < my) my = y; }
  return cells.map(([x, y]) => [x - mx, y - my]).sort((a, b) => a[1] - b[1] || a[0] - b[0]);
}
function rot90(cells) { return normalize(cells.map(([x, y]) => [-y, x])); }
const ROTS = {};
for (const k in SHAPES) {
  const list = [], seen = new Set();
  let c = normalize(SHAPES[k].cells);
  for (let i = 0; i < 4; i++) {
    const key = JSON.stringify(c);
    if (!seen.has(key)) { seen.add(key); list.push(c); }
    c = rot90(c);
  }
  ROTS[k] = list;
}

function pickType(rng, counts) {
  const opts = []; let total = 0;
  for (const k in TYPE_W) { if ((counts[k] || 0) >= 2) continue; opts.push(k); total += TYPE_W[k]; }
  let r = rng() * total;
  for (const k of opts) { r -= TYPE_W[k]; if (r <= 0) return k; }
  return opts[opts.length - 1];
}

function countSolutions(hole, N, types, cap = 500) {
  const cells = Uint8Array.from(hole);
  const used = new Array(types.length).fill(false);
  let count = 0;
  function rec(start) {
    if (count >= cap) return;
    let idx = start;
    while (idx < N * N && !cells[idx]) idx++;
    if (idx >= N * N) { count++; return; }
    const cx = idx % N, cy = (idx / N) | 0;
    const tried = new Set();
    for (let i = 0; i < types.length; i++) {
      if (used[i] || tried.has(types[i])) continue;
      tried.add(types[i]);
      for (const rc of ROTS[types[i]]) {
        const ox = cx - rc[0][0], oy = cy - rc[0][1];
        let ok = true;
        for (const [x, y] of rc) {
          const X = ox + x, Y = oy + y;
          if (X < 0 || Y < 0 || X >= N || Y >= N || !cells[Y * N + X]) { ok = false; break; }
        }
        if (!ok) continue;
        for (const [x, y] of rc) cells[(oy + y) * N + ox + x] = 0;
        used[i] = true;
        rec(idx);
        used[i] = false;
        for (const [x, y] of rc) cells[(oy + y) * N + ox + x] = 1;
        if (count >= cap) return;
      }
    }
  }
  rec(0);
  return count;
}

const DIFFICULTY = { pieces: 5, minArea: 18, maxArea: 20, maxSolutions: 6 };
// single standard difficulty (flat for every visitor): 5 modules, 60 s
const TIERS = {

};

function generate(seed, opt = {}) {
  const D = { ...DIFFICULTY, ...opt };
  const N = opt.size || 8, minP = D.pieces, maxP = D.pieces;
  const rng = mulberry32(seed >>> 0);
  for (let attempt = 0; attempt < 500; attempt++) {
    const count = minP + Math.floor(rng() * (maxP - minP + 1));
    const hole = new Uint8Array(N * N);
    const solution = [], counts = {};
    let failed = false;
    for (let p = 0; p < count && !failed; p++) {
      let done = false;
      for (let t = 0; t < 20 && !done; t++) {
        const type = pickType(rng, counts);
        const rots = ROTS[type], rot = Math.floor(rng() * rots.length), cells = rots[rot];
        let w = 0, h = 0;
        for (const [x, y] of cells) { if (x + 1 > w) w = x + 1; if (y + 1 > h) h = y + 1; }
        const cands = []; let total = 0;
        for (let oy = 0; oy <= N - h; oy++) for (let ox = 0; ox <= N - w; ox++) {
          let ok = true, contact = 0, edge = 0;
          for (const [cx, cy] of cells) {
            const x = ox + cx, y = oy + cy;
            if (hole[y * N + x]) { ok = false; break; }
            if (x === 0 || y === 0 || x === N - 1 || y === N - 1) edge++;
            if (x > 0 && hole[y * N + x - 1]) contact++;
            if (x < N - 1 && hole[y * N + x + 1]) contact++;
            if (y > 0 && hole[(y - 1) * N + x]) contact++;
            if (y < N - 1 && hole[(y + 1) * N + x]) contact++;
          }
          if (!ok) continue;
          let wgt;
          if (p === 0) {
            const d = Math.abs(ox + w / 2 - N / 2) + Math.abs(oy + h / 2 - N / 2);
            wgt = Math.max(0.05, 1 - d / 4);
          } else {
            if (!contact) continue;
            wgt = contact;
          }
          if (edge) wgt *= 0.2;
          cands.push([ox, oy, wgt]); total += wgt;
        }
        if (!cands.length) continue;
        let r = rng() * total, pick = cands[cands.length - 1];
        for (const c of cands) { r -= c[2]; if (r <= 0) { pick = c; break; } }
        for (const [cx, cy] of cells) hole[(pick[1] + cy) * N + pick[0] + cx] = 1;
        solution.push({ type, rot, x: pick[0], y: pick[1] });
        counts[type] = (counts[type] || 0) + 1;
        done = true;
      }
      if (!done) failed = true;
    }
    if (failed) continue;
    const area = hole.reduce((a, b) => a + b, 0);
    if (area < D.minArea || area > D.maxArea) continue;
    const types = solution.map(s => s.type);
    const solutions = countSolutions(hole, N, types, D.maxSolutions + 1);
    if (solutions > D.maxSolutions) continue;
    const tray = types.map((type, id) => ({ id, type }));
    for (let i = tray.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [tray[i], tray[j]] = [tray[j], tray[i]]; }
    return { seed: seed >>> 0, size: N, hole, solution, tray, solutions };
  }
  throw new Error('generation failed for seed ' + seed);
}

          float nMacro = indFbm(vIndP.xz * 0.55 + vIndP.y * 0.7);

    if (!g.attributes.normal) g.computeVertexNormals();

    g.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
    g.clearGroups();
    g.applyMatrix4(o.matrixWorld);
    const mUse = ensureVcMat(o.material);
    const k = mUse.uuid;
    if (!buckets.has(k)) buckets.set(k, { mat: mUse, list: [] });

    m.castShadow = m.receiveShadow = !mUse.wireframe;
    out.add(m);

}

function applyKitMarine() {

    for (const s of mr.sisters) {
      s.host.remove(s.body);
      s.body = bakeStatic(KIT.sister_platform.clone());
      s.host.add(s.body);
    }
  }
  if (KIT.flare_boom) {
    mr.flareBoomWrap.clear();
    mr.flareBoomWrap.add(bakeStatic(KIT.flare_boom.clone()));
  }
  if (KIT.supply_vessel) {
    mr.boatWrap.clear();
    mr.boatWrap.add(bakeStatic(KIT.supply_vessel.clone()));
  }
  if (KIT.crew_boat && mr.crewWrap) {
    mr.crewWrap.clear();
    mr.crewWrap.add(bakeStatic(KIT.crew_boat.clone()));
  }
  if (KIT.riser_dolphin && mr.dolphinWrap) {
    mr.dolphinWrap.clear();
    mr.dolphinWrap.add(bakeStatic(KIT.riser_dolphin.clone()));
  }
  if (KIT.sea_buoy) {
    for (const b of mr.buoys) {
      b.userData.wrap.clear();
      b.userData.wrap.add(bakeStatic(KIT.sea_buoy.clone()));
    }
  }
  if (KIT.offshore_heli) {
    const hd = heli.userData;
    hd.bodyWrap.clear();
    hd.bodyWrap.add(KIT.offshore_heli.clone());
    if (KIT.offshore_heli_rotor) {

    if (KIT.offshore_heli_tailrotor) {
      hd.tailRot.clear();

    }
  }
  dirtyShadows();
}

    if (kind === 'ghost') { const f = new THREE.Mesh(FOOT_PLANE, footMat); f.position.set(x, 0.02, y); g.add(f); }
  }
  return g;
}

// ---------------------------------------------------------------- decor (pre-placed buildings + marine zoning)
const BUILD_COLORS = [0x7a5242, 0x8a8170, 0x5f666c, 0x93979b, 0x6b6050, 0x58605a, 0x7c5648];
function shuffle(a, rng) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function hidesHole(hole, x0, y0, w, rows) {
  for (let x = x0; x < x0 + w; x++) for (let y = y0 - 1; y >= Math.max(0, y0 - rows); y--) if (hole[y * N + x]) return true;
  return false;
}
function maxHeightAt(hole, x0, y0, w, h) {
  let maxH = (y0 + h === N) ? 1.25 : 1.75;
  if (hidesHole(hole, x0, y0, w, 1)) maxH = Math.min(maxH, 0.55);
  else if (hidesHole(hole, x0, y0, w, 2)) maxH = Math.min(maxH, 1.05);
  return maxH;
}

function buildDecor(level, group) {
  const rng = mulberry32((level.seed ^ 0x9e3779b9) >>> 0);
  const used = Uint8Array.from(level.hole);
  const order = shuffle([...Array(N * N).keys()], rng);
  const bigSizes = [[3, 2], [2, 3], [2, 2], [3, 1], [1, 3], [2, 1], [1, 2]];
  const st = { derrick: false, heli: false, heliPos: null, counts: {}, placed: [] };
  for (const idx of order) {
    if (used[idx]) continue;
    const x0 = idx % N, y0 = (idx / N) | 0;
    let rect = [1, 1];
    for (const [w, h] of shuffle(bigSizes.slice(), rng)) {
      if (x0 + w > N || y0 + h > N) continue;
      if ((w === 3 && h === 2 || w === 2 && h === 3) && maxHeightAt(level.hole, x0, y0, w, h) < 1.55) continue;
      let ok = true;
      for (let y = y0; y < y0 + h && ok; y++) for (let x = x0; x < x0 + w; x++) if (used[y * N + x]) { ok = false; break; }
      if (ok) { rect = [w, h]; break; }
    }
    for (let y = y0; y < y0 + rect[1]; y++) for (let x = x0; x < x0 + rect[0]; x++) used[y * N + x] = 1;
    makeStructure(group, level.hole, x0, y0, rect[0], rect[1], rng, st);
  }
  return st;
}

const KIT_BUILDINGS = {
  '1x1': ['bld_1x1_a', 'bld_1x1_b', 'bld_1x1_c', 'bld_1x1_d', 'bld_1x1_e', 'bld_1x1_f'],
  '2x1': ['bld_2x1_a', 'bld_2x1_b', 'bld_2x1_c', 'bld_2x1_d'],
  '3x1': ['bld_3x1_a', 'bld_3x1_b', 'bld_3x1_c', 'bld_3x1_d'],
  '2x2': ['bld_2x2_a', 'bld_2x2_b', 'bld_2x2_c', 'bld_2x2_d', 'bld_2x2_e', 'bld_2x2_f'],
  '3x2': ['bld_3x2_a'],
  '2x3': ['bld_2x3_a'],
};
const DECOR_TINTS = [0x8fa8b8, 0xc8b48a, 0x8ea696, 0xb88c7a, 0x9aa4ad, 0x7c92a6];
const decorLiveryCache = new Map();
function getDecorLivery(origMat, tintIdx) {
  const k = origMat.uuid + ':' + tintIdx;
  if (!decorLiveryCache.has(k)) {
    const c = origMat.clone();
    c.color = c.color.clone().lerp(new THREE.Color(DECOR_TINTS[tintIdx]), 0.24);
    const ik = origMat.userData.indKind || indKindForName(origMat.name);
    if (ik) applyIndustrialPBR(c, ik);
    decorLiveryCache.set(k, c);
  }
  return decorLiveryCache.get(k);
}
function outwardQuarters(x0, y0, w, h) {
  const qs = [];
  if (x0 + w === N) qs.push(0); // +X sea edge
  if (y0 === 0) qs.push(1);     // -Z far edge
  if (x0 === 0) qs.push(2);     // -X sea edge
  if (y0 + h === N) qs.push(3); // +Z near edge
  return qs;
}

function kitBuilding(g, hole, x0, y0, w, h, maxH, rng, st) {
  const derrickOk = !st.derrick && y0 <= 2 && !hidesHole(hole, x0, y0, w, N);
  const onPerimeter = x0 === 0 || x0 + w === N || y0 === 0 || y0 + h === N;
  const outQs = outwardQuarters(x0, y0, w, h);
  const cands = [];
  const add = (key, qs) => {
    for (const n of KIT_BUILDINGS[key] || []) {
      if (!KIT[n]) continue;
      if (n === 'bld_2x2_d' && !derrickOk) continue;
      if (n === 'bld_2x2_c' && (st.heli || !onPerimeter)) continue;
      if (n === 'bld_2x3_a' && !onPerimeter) continue;
      if (n === 'bld_1x1_b' && !onPerimeter) continue;
      for (const q of qs) {
        if ((n === 'bld_2x3_a' || n === 'bld_1x1_b') && !outQs.includes(q)) continue;
        cands.push([n, q]);
      }
    }
  };
  if (w === h) add(`${w}x${h}`, [0, 1, 2, 3]);
  else { add(`${w}x${h}`, [0, 2]); add(`${h}x${w}`, [1, 3]); }
  if (!cands.length) return false;
  let pick = cands.find(c => c[0] === 'bld_2x2_d' && rng() < 0.65);
  if (!pick) {
    let fit = cands.filter(c => c[0] !== 'bld_2x2_d' && KIT[c[0]].userData.h <= maxH + 0.05);
    if (!fit.length) return false;
    const x1 = x0 + w - 1, y1 = y0 + h - 1;
    const nearbyNames = new Set(
      st.placed
        .filter(p => Math.max(0, p.x0 - (x1 + 1), x0 - (p.x1 + 1)) <= 1 && Math.max(0, p.y0 - (y1 + 1), y0 - (p.y1 + 1)) <= 1)
        .map(p => p.name)
    );
    const nonAdj = fit.filter(c => !nearbyNames.has(c[0]));
    if (nonAdj.length) fit = nonAdj;
    let minCnt = Infinity;
    for (const c of fit) minCnt = Math.min(minCnt, st.counts[c[0]] || 0);
    const balanced = fit.filter(c => (st.counts[c[0]] || 0) === minCnt);
    pick = balanced[Math.floor(rng() * balanced.length)];
  }
  const [name, q] = pick;
  st.counts[name] = (st.counts[name] || 0) + 1;
  st.placed.push({ name, x0, y0, x1: x0 + w - 1, y1: y0 + h - 1 });
  if (name === 'bld_2x2_d') st.derrick = true;
  if (name === 'bld_2x2_c') { st.heli = true; st.heliPos = new THREE.Vector3(g.position.x, 0.23, g.position.z); }
  const m = KIT[name].clone();
  const tintIdx = Math.floor(rng() * DECOR_TINTS.length);
  m.traverse(o => {
    if (!o.isMesh || !o.material) return;
    const mapMat = mt => (mt.name === 'b2_clad' || mt.name === 'b2_offwhite') ? getDecorLivery(mt, tintIdx) : mt;
    o.material = Array.isArray(o.material) ? o.material.map(mapMat) : mapMat(o.material);
  });
  m.rotation.y = q * Math.PI / 2;
  g.add(m);
  return true;
}

function makeStructure(group, hole, x0, y0, w, h, rng, st) {
  const g = new THREE.Group();
  const c = cellPos(x0 + (w - 1) / 2, y0 + (h - 1) / 2);
  g.position.copy(c);
  g.position.y = 0; // flush with deck y=0
  group.add(g);
  const maxH = maxHeightAt(hole, x0, y0, w, h);
  if (KIT && kitBuilding(g, hole, x0, y0, w, h, maxH, rng, st)) return;
  const col = () => BUILD_COLORS[Math.floor(rng() * BUILD_COLORS.length)];
  const W = w - 0.1, D = h - 0.1;
  const r = rng();

  if (w === 2 && h === 2 && !st.derrick && y0 <= 2 && !hidesHole(hole, x0, y0, w, N) && r < 0.6) {
    st.derrick = true;
    addMesh(g, new THREE.BoxGeometry(W, 0.35, D), mat(0x6c747c), 0, 0.175, 0);
    const tower = new THREE.Mesh(new THREE.ConeGeometry(0.75, 3.2, 4, 6, true), new THREE.MeshBasicMaterial({ color: 0xd94a3a, wireframe: true }));
    tower.rotation.y = Math.PI / 4; tower.position.y = 0.35 + 1.6; g.add(tower);
    addMesh(g, new THREE.BoxGeometry(0.35, 0.3, 0.35), mat(0xd94a3a), 0, 3.6, 0);
    return;
  }
  if (w === 2 && h === 2 && !st.heli && r < 0.25) {
    st.heli = true; st.heliPos = new THREE.Vector3(c.x, 0.13, c.z);
    addMesh(g, new THREE.CylinderGeometry(0.95, 0.95, 0.12, 24), mat(0x3e464d, 0.9, 0.1), 0, 0.06, 0);
    addMesh(g, new THREE.BoxGeometry(0.1, 0.02, 0.8), mat(0xffffff, 0.5, 0), -0.25, 0.13, 0, false);
    addMesh(g, new THREE.BoxGeometry(0.1, 0.02, 0.8), mat(0xffffff, 0.5, 0), 0.25, 0.13, 0, false);
    addMesh(g, new THREE.BoxGeometry(0.5, 0.02, 0.1), mat(0xffffff, 0.5, 0), 0, 0.13, 0, false);
    return;
  }
  const h1 = Math.min(maxH, 0.28 + rng() * 0.2);
  const c1 = col();
  addMesh(g, new THREE.BoxGeometry(W, h1, D), mat(c1), 0, h1 / 2, 0);
  addMesh(g, new THREE.BoxGeometry(W + 0.02, 0.05, D + 0.02), mat(new THREE.Color(c1).multiplyScalar(0.6).getHex()), 0, h1 * 0.55, 0);
}

// Flush offshore construction bay frame: hazard coaming curbs + convex corner alignment beacons
const CURB_X = new THREE.BoxGeometry(1.0, 0.032, 0.048);
const CURB_Z = new THREE.BoxGeometry(0.048, 0.032, 1.0);
const BEACON_BASE = new THREE.CylinderGeometry(0.038, 0.045, 0.045, 8);
const BEACON_LENS = new THREE.CylinderGeometry(0.024, 0.024, 0.022, 8);
for (const g of [CURB_X, CURB_Z, BEACON_BASE, BEACON_LENS]) g.userData.shared = true;
const beaconLensMat = new THREE.MeshStandardMaterial({ color: 0x0a3d52, emissive: 0x29d3ff, emissiveIntensity: 2.2, roughness: 0.3 });

function buildBayFrame(hole, group) {
  const cm = mat(0xc49a2c, 0.48, 0.2), gm = mat(0x2d343a, 0.65, 0.5);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (!hole[y * N + x]) continue;
    const p = cellPos(x, y);
    const nN = y > 0 && hole[(y - 1) * N + x];
    const nS = y < N - 1 && hole[(y + 1) * N + x];
    const nW = x > 0 && hole[y * N + x - 1];
    const nE = x < N - 1 && hole[y * N + x + 1];
    if (!nN) { addMesh(group, CURB_X, gm, p.x, 0.012, p.z - 0.482, false); addMesh(group, CURB_X, cm, p.x, 0.022, p.z - 0.482, false); }
    if (!nS) { addMesh(group, CURB_X, gm, p.x, 0.012, p.z + 0.482, false); addMesh(group, CURB_X, cm, p.x, 0.022, p.z + 0.482, false); }
    if (!nW) { addMesh(group, CURB_Z, gm, p.x - 0.482, 0.012, p.z, false); addMesh(group, CURB_Z, cm, p.x - 0.482, 0.022, p.z, false); }
    if (!nE) { addMesh(group, CURB_Z, gm, p.x + 0.482, 0.012, p.z, false); addMesh(group, CURB_Z, cm, p.x + 0.482, 0.022, p.z, false); }
    for (const [b1, b2, dx, dz] of [[!nN, !nW, -0.475, -0.475], [!nN, !nE, 0.475, -0.475], [!nS, !nW, -0.475, 0.475], [!nS, !nE, 0.475, 0.475]]) {
      if (b1 && b2) {
        addMesh(group, BEACON_BASE, gm, p.x + dx, 0.022, p.z + dz, false);
        addMesh(group, BEACON_LENS, beaconLensMat, p.x + dx, 0.052, p.z + dz, false);
      }
    }
  }
}

function todayLbKey() {

function loadLeaderboard() {

    const raw = JSON.parse(localStorage.getItem(todayLbKey()) || '{}');
    return { cadet: raw.cadet || [], engineer: raw.engineer || [], chief: raw.chief || [] };
  } catch { return { cadet: [], engineer: [], chief: [] }; }

function addLeaderboardEntry(tier, tag, elapsed, stars) {
  const lb = loadLeaderboard();
  const list = lb[tier] || [];

  list.push(entry);
  list.sort((a, b) => a.elapsed - b.elapsed || b.stars - a.stars);

function generateUnique() {
  const tierOpt = TIERS[activeTier];
  if (fixedSeed !== null) return generate(fixedSeed, tierOpt);
  const seen = loadSeen(), set = new Set(seen);
  let lvl;
  for (let i = 0; i < 50; i++) {

  for (const s of level.solution) {

  sel = 0; rot = 0; ghostArmed = false; hintUsed = false; hintTimer = 0;

}

const fmt = s => { s = Math.max(0, Math.ceil(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

// ---------------------------------------------------------------- effects
const effects = [];
function burstCells(cells, ox, oy) {
  for (const [x, y] of cells) {
    const m = new THREE.Mesh(FOOT_PLANE, new THREE.MeshBasicMaterial({ map: cellTex, color: new THREE.Color(2.2, 2.2, 2.2), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
    m.position.copy(cellPos(ox + x, oy + y)); m.position.y = 0.05;
    scene.add(m);
    effects.push({ m, t: 0, dur: 0.55, kind: 'burst' });
  }
}
function confetti() {
  const n = 240, cols = [0x0085ca, 0xe4002b, 0x009639, 0x29d3ff, 0xffc23d, 0xffffff];
  const im = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.13, 0.08), new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }), n);
  const parts = [];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 5;
    parts.push({
      p: new THREE.Vector3((Math.random() - 0.5) * 2, 1.5 + Math.random(), (Math.random() - 0.5) * 2),
      v: new THREE.Vector3(Math.cos(a) * sp, 5 + Math.random() * 5, Math.sin(a) * sp),
      r: new THREE.Euler(Math.random() * 6, Math.random() * 6, Math.random() * 6), s: (Math.random() - 0.5) * 14,
    });
    im.setColorAt(i, new THREE.Color(cols[i % cols.length]));
  }
  scene.add(im);
  effects.push({ m: im, t: 0, dur: 5, kind: 'confetti', parts });
}
const dummy = new THREE.Object3D();
function updateEffects(dt) {
  for (let i = effects.length - 1; i >= 0; i--) {
    const e = effects[i];
    e.t += dt;
    const p = e.t / e.dur;
    if (e.kind === 'burst') {
      e.m.scale.setScalar(1 + p * 0.7);
      e.m.position.y = 0.05 + p * 0.9;
      e.m.material.opacity = 1 - p;
    } else if (e.kind === 'confetti') {
      e.parts.forEach((q, j) => {
        q.v.y -= 7 * dt; q.v.multiplyScalar(1 - 1.2 * dt);
        q.p.addScaledVector(q.v, dt);
        q.r.x += q.s * dt; q.r.y += q.s * 0.7 * dt;
        dummy.position.copy(q.p); dummy.rotation.copy(q.r); dummy.updateMatrix();
        e.m.setMatrixAt(j, dummy.matrix);
      });
      e.m.instanceMatrix.needsUpdate = true;
    }
    if (p >= 1) {
      scene.remove(e.m);
      e.m.material.dispose();
      if (e.kind === 'confetti') e.m.geometry.dispose();
      effects.splice(i, 1);
    }
  }
}

const unplaced = () => tray.filter(t => !t.placed);
const current = () => { const u = unplaced(); return u.length ? u[Math.min(sel, u.length - 1)] : null; };
function curCells() { const c = current(); return ROTS[c.type][rot % ROTS[c.type].length]; }
function anchorOf(cells) {
  let mx = 0, my = 0;
  for (const [x, y] of cells) { mx += x; my += y; }
  mx /= cells.length; my /= cells.length;
  let best = cells[0], bd = 1e9;
  for (const c of cells) { const d = (c[0] - mx) ** 2 + (c[1] - my) ** 2; if (d < bd - 1e-9) { bd = d; best = c; } }
  return best;
}

let snapMode = false;
function snapOrigin(cx, cy, cells, a) {
  let best = null, bd = 1e9;
  for (const c of cells) {
    if (Math.abs(c[0] - a[0]) + Math.abs(c[1] - a[1]) > 1) continue;
    const ox = cx - c[0], oy = cy - c[1];
    if (!canPlace(cells, ox, oy)) continue;
    const d = (c[0] - a[0]) ** 2 + (c[1] - a[1]) ** 2;
    if (d < bd) { bd = d; best = { x: ox, y: oy }; }
  }
  return best;
}
function ghostOrigin() {
  const cells = curCells(), a = anchorOf(cells);
  if (snapMode) { const s = snapOrigin(cursor.x, cursor.y, cells, a); if (s) return s; }
  return { x: cursor.x - a[0], y: cursor.y - a[1] };
}
function canPlace(cells, ox, oy) {
  for (const [x, y] of cells) {
    const X = ox + x, Y = oy + y;
    if (X < 0 || Y < 0 || X >= N || Y >= N) return false;
    const i = Y * N + X;
    if (!level.hole[i] || occ[i] !== -1) return false;
  }
  return true;
}
function refreshValidity() {
  if (!current()) { ghostValid = false; return; }
  const o = ghostOrigin();
  ghostValid = canPlace(curCells(), o.x, o.y);
  const col = ghostValid ? 0x46ff7a : 0xff4b4b;
  ghostMat.color.set(col); ghostMat.emissive.set(ghostValid ? 0x1a6b30 : 0x6b1a1a); footMat.color.set(col);
}
function rebuildGhost() {
  if (ghost) { scene.remove(ghost); ghost = null; }
  const c = current();
  if (c) {
    ghost = makePiece(c.type, curCells(), 'ghost', rot % ROTS[c.type].length);
    const o = ghostOrigin();
    ghost.position.copy(cellPos(o.x, o.y));
    scene.add(ghost);
  }
  refreshValidity();
}

// ---------------------------------------------------------------- actions
function move(dx, dy) {
  if (status !== 'play' && status !== 'ready') return;
  const nx = Math.max(0, Math.min(N - 1, cursor.x + dx)), ny = Math.max(0, Math.min(N - 1, cursor.y + dy));
  if (nx === cursor.x && ny === cursor.y) return;
  cursor = { x: nx, y: ny }; snapMode = false; ghostArmed = true;
  refreshValidity();
  sfx('move', () => beep(880, 0.02, 'sine', 0.03), 0.95 + Math.random() * 0.1);
}
function rotate() {
  const c = current();
  if (status !== 'play' || !c) return;
  rot = c.rot = (rot + 1) % ROTS[c.type].length;
  rebuildGhost(); renderTray();
  sfx('rotate', () => beep(660, 0.05, 'triangle', 0.08));
}
function cycle(d) {
  if (status !== 'play') return;
  const u = unplaced(); if (u.length < 2) return;
  sel = (Math.min(sel, u.length - 1) + d + u.length) % u.length;
  rot = u[sel].rot || 0;
  rebuildGhost(); renderTray();
  sfx('select', () => beep(520, 0.04, 'triangle', 0.06));
}
function selectId(id) {
  const u = unplaced(), i = u.findIndex(t => t.id === id);
  if (i >= 0) { sel = i; rot = u[i].rot || 0; rebuildGhost(); renderTray(); }
}
function place(allowPickup = true) {
  const c = current(); if (!c) return false;
  const cells = curCells(), o = ghostOrigin();
  if (!canPlace(cells, o.x, o.y)) {
    if (allowPickup && occ[cursor.y * N + cursor.x] !== -1) { pickUp(cursor.y * N + cursor.x); return false; }
    shake = 0.35; sfx('invalid', () => beep(150, 0.18, 'square', 0.08));
    toast(TR().toastNoFit); buzz([35, 40, 35]);
    return false;
  }
  buzz(18);
  if (snapMode) ghostArmed = false;
  burstCells(cells, o.x, o.y);
  const mesh = makePiece(c.type, cells, 'solid', rot % ROTS[c.type].length);
  mesh.position.copy(cellPos(o.x, o.y));
  mesh.userData.drop = 1;
  levelGroup.add(mesh);
  const rec = { id: c.id, type: c.type, rot: rot % ROTS[c.type].length, x: o.x, y: o.y, cells, mesh };
  placed.push(rec);
  for (const [x, y] of cells) { const i = (o.y + y) * N + o.x + x; occ[i] = c.id; holePlanes[i].visible = false; }
  c.placed = true;
  sel = Math.min(sel, Math.max(0, unplaced().length - 1));
  rot = current() ? (current().rot || 0) : 0;
  sfx('place', () => { beep(420, 0.08, 'triangle', 0.12); setTimeout(() => beep(630, 0.08, 'triangle', 0.1), 60); });
  rebuildGhost(); renderTray();
  if (placed.length === tray.length) win();
  return true;
}
function restorePiece(prev) {
  const t = tray.find(x => x.id === prev.id);
  if (!t || t.placed) return;
  const cells = ROTS[t.type][prev.rot];
  if (!canPlace(cells, prev.x, prev.y)) return;
  const mesh = makePiece(t.type, cells, 'solid', prev.rot);
  mesh.position.copy(cellPos(prev.x, prev.y));
  mesh.userData.drop = 0.35;
  levelGroup.add(mesh);
  placed.push({ id: t.id, type: t.type, rot: prev.rot, x: prev.x, y: prev.y, cells, mesh });
  for (const [x, y] of cells) { const i = (prev.y + y) * N + prev.x + x; occ[i] = t.id; holePlanes[i].visible = false; }
  t.placed = true; ghostArmed = false;
  sel = Math.min(sel, Math.max(0, unplaced().length - 1));
  rot = current() ? (current().rot || 0) : 0;
  rebuildGhost(); renderTray(); dirtyShadows();
}
function pickUp(cellIdx) {
  const id = occ[cellIdx]; if (id === -1) return null;
  const k = placed.findIndex(p => p.id === id), p = placed[k];
  const prev = { id: p.id, rot: p.rot, x: p.x, y: p.y };
  placed.splice(k, 1);
  disposeGroup(p.mesh); levelGroup.remove(p.mesh); dirtyShadows();
  for (const [x, y] of p.cells) { const i = (p.y + y) * N + p.x + x; occ[i] = -1; holePlanes[i].visible = true; }
  const tr = tray.find(t => t.id === id);
  tr.placed = false; tr.rot = p.rot;
  selectId(id); ghostArmed = true;
  rebuildGhost(); renderTray();
  sfx('pickup', () => beep(300, 0.08, 'triangle', 0.1));
  return prev;
}
function undoLast() {
  if (status !== 'play' || !placed.length) return;
  const p = placed[placed.length - 1];
  pickUp((p.y + p.cells[0][1]) * N + p.x + p.cells[0][0]);
}
function back() {
  if (status !== 'play') return;
  const i = cursor.y * N + cursor.x;
  if (occ[i] !== -1) pickUp(i);
  else if (placed.length) { const p = placed[placed.length - 1]; pickUp((p.y + p.cells[0][1]) * N + p.x + p.cells[0][0]); }
}
function confirm() {
  ensureAudio();
  if (status === 'ready') { setStatus('play'); sfx('start', () => beep(520, 0.1, 'triangle', 0.12)); }
  else if (status === 'play') place();
  else if (performance.now() - endTime > 600) {   // «YENİ RAUND» / «YENİDƏN CƏHD ET»: straight into the next round
    newRound(); setStatus('play'); sfx('start', () => beep(520, 0.1, 'triangle', 0.12));
  }
}
function win() {
  const total = roundDuration();
  lastElapsed = Math.max(0.1, total - timeLeft);
  lastStars = timeLeft >= total * 0.5 ? 3 : timeLeft >= total * 0.25 ? 2 : 1;
  setStatus('win');
  if (ghost) ghost.visible = false;
  placed.forEach((p, i) => { p.mesh.userData.bounce = -i * 0.12; });
  confetti();
  // Launch SOCAR helicopter commissioning sequence
  const hd = heli.userData;
  hd.active = true; hd.t = 0;
  hd.start.set(18, 12, -20);
  if (currentHeliPos) { hd.mode = 'land'; hd.target.copy(currentHeliPos); }
  else { hd.mode = 'hover'; hd.target.set(-5.6, 2.0, -2.2); }
  heli.position.copy(hd.start);
  heli.visible = true;
  sfx('win', () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.18, 'triangle', 0.12), i * 120)));
  for (let i = 0; i < lastStars; i++) setTimeout(() => sfx('star', null, 1 + i * 0.12), 450 + i * 180);
}
function lose() {
  setStatus('lose');
  if (ghost) ghost.visible = false;
  hintGroup.children.forEach(c => { c.visible = true; }); hintTimer = 0;
  hintGroup.visible = true;
  sfx('lose', () => { beep(220, 0.3, 'sawtooth', 0.08); setTimeout(() => beep(165, 0.4, 'sawtooth', 0.08), 250); });
}

  camera.aspect = w / h;
  camera.setViewOffset(w, h, side / 2, 0, w, h);
  viewAspect = (w - side) / h;
  camera.updateProjectionMatrix();
  placeCamera();
}
addEventListener('resize', resize);
// mobile browsers: never let the page zoom (pinch / double-tap / rotation keep-zoom) — the side panel would slide off screen
(() => {
  const meta = document.querySelector('meta[name=viewport]');
  const resetZoom = () => {
    if (!window.visualViewport || visualViewport.scale <= 1.01) return;
    const c = meta.content; meta.content = c + ',minimum-scale=1'; setTimeout(() => { meta.content = c; }, 60);
  };
  const later = () => { resize(); resetZoom(); setTimeout(() => { resize(); resetZoom(); }, 350); };
  addEventListener('orientationchange', later);
  document.addEventListener('fullscreenchange', later);
  if (window.visualViewport) visualViewport.addEventListener('resize', () => { resetZoom(); resize(); });
  document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  let lastEnd = 0;
  document.addEventListener('touchend', e => {
    const now = performance.now();
    if (now - lastEnd < 350 && !e.target.closest('button')) e.preventDefault();   // kill double-tap zoom
    lastEnd = now;
  }, { passive: false });
  document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
})();
applyQuality();

const perf = { acc: 0, n: 0, since: 0, fps: 0, ms: 0, show: params0.has('fps') };
function trackPerf(rawMs, now) {
  if (document.visibilityState !== 'visible' || rawMs > 250) return;
  perf.acc += rawMs; perf.n++;
  if (now - perf.since < 2500) return;
  perf.ms = perf.acc / perf.n; perf.fps = 1000 / perf.ms;
  if (perf.fps < 48 && now > 4000 && qLevel < QUALITY.length - 1 && !params0.has('q') && !qLocked) { qLevel++; applyQuality(); }
  if (perf.show) {
    const el = $('fps'); el.style.display = 'block';
    el.textContent = `${perf.fps.toFixed(0)} fps · ${perf.ms.toFixed(1)} ms · q${qLevel} · ${renderer.info.render.calls} calls · pr ${renderer.getPixelRatio().toFixed(2)}`;
  }
  perf.acc = 0; perf.n = 0; perf.since = now;
}
addEventListener('keydown', e => { if (e.code === 'KeyF') { perf.show = !perf.show; $('fps').style.display = perf.show ? 'block' : 'none'; } });

let last = performance.now(), T = 0;
function loop(now) {
  renderer.info.reset();
  const rawMs = now - last;
  const dt = Math.min(0.05, rawMs / 1000); last = now; T += dt;
  trackPerf(rawMs, now);
  pollPad(dt);
  animWater(T); surround(T);
  if (SCENES[sceneId].anim) {   // pumpjack: crank turns, walking beam nods (~7 strokes/min sped up for the stand)
    const th = T * 1.6;
    for (const a of SCENES[sceneId].anim) { a.o.quaternion.copy(a.rest); a.o.rotateZ(a.crank ? -th : -0.2 * Math.sin(th)); }
  }
  if (status === 'play') {
    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; lose(); }
    updateTimer();
  }
  holeMat.opacity = 0.78 + 0.22 * Math.sin(T * 3);
  beaconLensMat.emissiveIntensity = 1.6 + 0.9 * Math.sin(T * 3.5);
  updateEffects(dt);
  if (status === 'win') { camOrbit += dt * 0.22; placeCamera(); }
  if (status === 'ready') { camOrbit += dt * 0.12; placeCamera(); }
  if (heli.visible && heli.userData.active) {
    const hd = heli.userData;
    hd.t = Math.min(1, hd.t + dt / 3.2);
    const s = hd.t * hd.t * (3 - 2 * hd.t);
    heli.position.lerpVectors(hd.start, hd.target, s);
    if (hd.mode === 'hover' && hd.t >= 1) heli.position.y = hd.target.y + Math.sin(T * 2.2) * 0.14;
    if (hd.mode === 'land' && hd.t >= 1) heli.rotation.set(0, 0.35, 0);
    else heli.rotation.set((1 - s) * 0.16, THREE.MathUtils.lerp(-0.9, 0.35, s), (1 - s) * 0.08);
    hd.rotor.rotation.y += dt * 26;
    hd.tailRot.rotation.x += dt * 36;
  }
  tickExpo(now, dt);
  if (status === 'lose') hintMat.opacity = 0.35 + 0.2 * Math.sin(T * 4);
  if (status === 'win' || status === 'lose') {
    const left = AUTO_RESTART - (now - endTime) / 1000, cd = $('cd');
    if (cd) cd.textContent = Math.max(0, Math.ceil(left));
    if (left <= 0) newRound();
  }
  if (ghost && current()) {
    const o = ghostOrigin(), target = cellPos(o.x, o.y);
    ghost.position.lerp(target, Math.min(1, dt * 18));
    if (shake > 0) { shake -= dt; ghost.position.x += Math.sin(T * 60) * 0.08 * (shake / 0.35); }
    ghost.userData.body.position.y = 0.45 + Math.sin(T * 4) * 0.06;
    ghost.visible = (status === 'play' || status === 'ready') && ghostArmed && !(drag && drag.moved && !drag.over);
  }
  for (const p of placed) {
    const ud = p.mesh.userData;
    if (ud.drop > 0 || ud.bounce !== undefined) dirtyShadows(1);
    if (ud.drop > 0) { ud.drop = Math.max(0, ud.drop - dt * 6); p.mesh.userData.body.position.y = ud.drop * ud.drop * 1.2; }
    if (ud.bounce !== undefined) {
      ud.bounce += dt * 2.2;
      const b = ud.bounce;
      p.mesh.userData.body.position.y = b > 0 && b < 1 ? Math.sin(b * Math.PI) * 0.5 : 0;
      if (b >= 1) delete ud.bounce;
    }
  }
  if (shadowFrames > 0) { renderer.shadowMap.needsUpdate = true; shadowFrames--; }
  composer.render();
  requestAnimationFrame(loop);
}

window.__game = {
  get status() { return status; }, get level() { return level; }, get placed() { return placed.length; },
  get tier() { return activeTier; }, get lang() { return lang; },
  start() { if (status === 'ready') setStatus('play'); },
  setTier(k) { if (TIERS[k]) { activeTier = k; newRound({ keepScreen: status === 'ready' }); } },
  setLang,
  autoSolve(steps = Infinity) {
    for (const s of level.solution) {
      if (steps-- <= 0) break;
      const t = tray.find(t => t.id === level.solution.indexOf(s));
      if (t.placed) continue;
      selectId(t.id); rot = s.rot;
      const a = anchorOf(ROTS[s.type][s.rot]);
      cursor = { x: s.x + a[0], y: s.y + a[1] };
      rebuildGhost(); place();
    }
  },
  newRound, setTime(v) { timeLeft = v; },
  dbg: { THREE, ROTS, scene, renderer, camera, waterMat, envTex, composer, bloom, sfxBuf, THUMB_CACHE, heli },
};

await loadKit();
KIT = KITS.platform || null;
applyKitPlatform();
applyKitMarine();          // shared sea props come from the platform kit
for (const id in SCENES) if (sceneReady(id) && (!SCENES[id].hidden || params0.get('scene') === id)) { setScene(id); buildThumbCache(); }
newRound();
applyLangUI();
requestAnimationFrame(loop);
</script>
</body>
