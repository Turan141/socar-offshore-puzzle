<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>SOCAR Offshore Puzzle</title>
<link rel="icon" href="assets/brand/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SOCAR Puzzle">
<meta name="theme-color" content="#071822">
<link rel="stylesheet" href="fonts/montserrat.css">
<style>
  /* Landscape 16:9 stand / tablet layout (designed at 1920x1080). 1rem = 1/54 of height. */
  :root{
    --socar-blue:#0085ca;--socar-red:#e4002b;--socar-green:#009639;
    --cyan:#29d3ff;--line:rgba(255,255,255,.14);--good:#3fe28a;--bad:#ff5a4e;--gold:#ffc23d;
    --side:min(27.5rem,38vw);--dock:18vh;--gap:1.2rem;
  }
  html{font-size:min(calc(100vh / 54),max(calc(100vw / 96),14px));-webkit-text-size-adjust:100%;text-size-adjust:100%} /* 14px floor: tablet text stays readable; no iOS landscape text inflation */
  html,body{margin:0;height:100%;overflow:hidden;background:#0d2330;font-family:Montserrat,"Segoe UI",Arial,sans-serif;color:#fff;
            user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
  button{font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  input{font-family:inherit;color:inherit;user-select:text;-webkit-user-select:text;-webkit-tap-highlight-color:transparent}
  #c{display:block;width:100%;height:100%;outline:none;touch-action:none}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:1;
            background:radial-gradient(ellipse at 42% 50%,rgba(0,0,0,0) 52%,rgba(3,12,20,.36) 100%);transition:opacity .5s}
  body[data-scene=onshore] #vignette,body[data-scene=kacalka] #vignette,body[data-scene=refinery] #vignette,body[data-scene=green] #vignette,body[data-scene=terminal] #vignette{opacity:.48}
  body{--ac:#29d3ff;--ac-rgb:41,211,255;--ac-deep:#0085ca}
  body[data-scene=onshore]{--ac:#3fe28a;--ac-rgb:63,226,138;--ac-deep:#009639}
  body[data-scene=kacalka]{--ac:#ffc23d;--ac-rgb:255,194,61;--ac-deep:#d98a12}
  body[data-scene=refinery]{--ac:#ff7b47;--ac-rgb:255,123,71;--ac-deep:#c94a1d}
  body[data-scene=green]{--ac:#2ee8b5;--ac-rgb:46,232,181;--ac-deep:#0f9e78}
  body[data-scene=terminal]{--ac:#5eb8ff;--ac-rgb:94,184,255;--ac-deep:#1a6ec4}
  .glass{background:rgba(7,19,28,.94);border:1px solid rgba(255,255,255,.12);box-shadow:0 .6rem 1.8rem rgba(0,0,0,.42)}

  /* branded loading overlay */
  #loader{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;
          background:radial-gradient(circle at 50% 42%,#103347 0%,#06141e 72%);transition:opacity .45s ease,visibility .45s ease}
  #loader.done{opacity:0;visibility:hidden;pointer-events:none}
  #loader .l-logo{width:min(20rem,58vw);height:auto;animation:breatheLogo 2.2s ease-in-out infinite}
  @keyframes breatheLogo{50%{transform:scale(1.03)}}
  #loader .l-sub{font-size:.82rem;font-weight:800;letter-spacing:.22rem;color:var(--cyan);opacity:.9;text-transform:uppercase}
  #loader .l-track{width:min(24rem,68vw);height:.55rem;border-radius:1rem;background:rgba(255,255,255,.10);border:1px solid rgba(41,211,255,.28);overflow:hidden}
  #loadBar{width:8%;height:100%;border-radius:1rem;background:linear-gradient(90deg,var(--socar-blue),var(--cyan),#3fe28a);transition:width .22s ease}
  #loadPct{font-size:.78rem;font-weight:800;letter-spacing:.12rem;opacity:.75;font-variant-numeric:tabular-nums}

  /* floating SOCAR flagship brand badge on start */
  #worldBadge{position:fixed;left:var(--gap);top:var(--gap);z-index:6;display:none;flex-direction:column;justify-content:center;
              padding:.8rem 1.35rem;border-radius:.9rem;
              max-width:calc(100vw - 36rem);pointer-events:none;overflow:hidden}
  body[data-state=ready] #worldBadge{display:flex}
  .wb-top{display:flex;align-items:center;gap:1.05rem}
  .wb-logo{height:2.75rem;width:auto;display:block;flex:none;transform:translateY(-.10rem);filter:drop-shadow(0 .2rem .5rem rgba(0,0,0,.45))}
  .wb-sep{width:1px;height:2.25rem;background:linear-gradient(180deg,transparent,rgba(255,255,255,.32),transparent);flex:none}
  .wb-id{display:flex;flex-direction:column;justify-content:center;gap:.26rem;text-align:left;min-width:0}
  #worldBadgeOrg{font-size:.7rem;font-weight:700;letter-spacing:.04rem;text-transform:uppercase;color:rgba(255,255,255,.62);line-height:1.2}
  .wb-sub{display:flex;align-items:center;gap:.48rem}
  #worldBadgeTxt{font-size:.9rem;font-weight:800;letter-spacing:.03rem;text-transform:uppercase;color:#ffffff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:1180px){.wb-logo{height:2.45rem}#worldBadge{padding:.68rem 1.05rem}}

  /* top celebration banner */
  #celebBanner{position:fixed;left:50%;top:1.5rem;transform:translateX(-50%);z-index:9;display:none;align-items:center;gap:.8rem;
               padding:.7rem 1.6rem;border-radius:.7rem;border-color:rgba(63,226,138,.55);pointer-events:none}
  body[data-state=celebrating] #celebBanner{display:flex;animation:fadeDown .35s ease-out}
  @keyframes fadeDown{from{opacity:0;transform:translate(-50%,-.6rem)}}
  #celebBanner i{font-style:normal;font-size:1.5rem;color:var(--gold)}
  #celebBanner b{font-size:1.3rem;font-weight:800;letter-spacing:.06rem;color:#eafff3}

  /* 360 spin pill during win inspection */
  #spinHint{position:fixed;left:var(--gap);bottom:var(--gap);z-index:6;display:none;align-items:center;gap:.5rem;
            padding:.48rem .95rem;border-radius:2rem;font-size:.74rem;font-weight:800;letter-spacing:.08rem;color:#d6f5ff;pointer-events:none}
  body[data-state=win] #spinHint{display:flex}
  #spinHint svg{width:1.25rem;height:1.25rem;color:var(--cyan)}

  /* top HUD over play area */
  .hud-top{position:fixed;left:0;right:calc(var(--side) + var(--gap) * 2);top:0;display:flex;align-items:center;gap:.9rem;
           padding:var(--gap) 1.4rem;pointer-events:none;background:linear-gradient(rgba(3,12,18,.56),rgba(3,12,18,0));z-index:4;
           transition:opacity .3s,transform .3s}
  body:not([data-state=play]) .hud-top{opacity:0;transform:translateY(-1.2rem);pointer-events:none}
  .hud-btn{pointer-events:auto;width:3.25rem;height:3.25rem;border-radius:50%;display:flex;align-items:center;justify-content:center;
           cursor:pointer;border:1px solid rgba(118,205,255,.26);color:#e4f6ff;transition:transform .1s,border-color .15s;flex:none}
  .hud-btn:hover{border-color:rgba(41,211,255,.6)}
  .hud-btn:active{transform:scale(.93)}
  .hud-btn svg{width:1.45rem;height:1.45rem}
  .hud-btn.muted{opacity:.6;color:#9bb6c4}
  .timer{display:flex;align-items:center;gap:.7rem;padding:.45rem 1.2rem .45rem .55rem;border-radius:3rem;flex:none}
  .timer svg{width:3rem;height:3rem;transform:rotate(-90deg)}
  .timer .trk{fill:none;stroke:rgba(255,255,255,.14);stroke-width:4}
  .timer .ring{fill:none;stroke:var(--cyan);stroke-width:4;stroke-linecap:round;stroke-dasharray:119.4;transition:stroke .3s}
  #timer{font-size:2rem;font-weight:800;letter-spacing:.05rem;font-variant-numeric:tabular-nums}
  .timer.warn .ring{stroke:var(--bad)} .timer.warn #timer{color:var(--bad);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.55}}
  #title{flex:1;min-width:0;text-align:center;font-size:min(1.32rem,1.5vw);line-height:1.15;text-wrap:balance;font-weight:900;letter-spacing:.04rem;
         text-shadow:0 .12rem .35rem rgba(0,0,0,.65)}
  #recBadge{flex:none;display:flex;align-items:center;gap:.42rem;padding:.5rem .95rem;border-radius:2rem;font-size:.8rem;font-weight:800;
            letter-spacing:.04rem;color:#ffe69c;border-color:rgba(255,194,61,.35);font-variant-numeric:tabular-nums}
  #recBadge b{color:#fff;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  #recBadge{max-width:min(16rem,15vw)}

  /* side tray */
  #tray{position:fixed;top:var(--gap);right:var(--gap);bottom:var(--gap);width:var(--side);box-sizing:border-box;border-radius:1.45rem;overflow:hidden;
        display:flex;flex-direction:column;padding:1.1rem 1.05rem 1.05rem;gap:.65rem;transition:opacity .38s,transform .38s;z-index:4}
  body:not([data-state=play]) #tray{opacity:0;transform:translateX(2.4rem);pointer-events:none}
  .brand{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.1rem .15rem .65rem;border-bottom:1px solid rgba(255,255,255,.11)}
  .brand-id{display:flex;align-items:center;gap:.6rem}
  .brand-logo{height:2.45rem;width:auto;display:block}
  .brand-txt{display:flex;flex-direction:column;line-height:1}
  .brand-txt small{font-size:.72rem;font-weight:700;letter-spacing:.06rem;color:rgba(255,255,255,.6);margin-top:.22rem}
  .lang-pill{display:inline-flex;background:rgba(4,16,25,.65);border:1px solid rgba(118,205,255,.22);border-radius:1.6rem;padding:.2rem;gap:.16rem}
  .lang-pill button{border:0;background:transparent;font-size:.74rem;font-weight:800;letter-spacing:.08rem;padding:.34rem .68rem;min-width:max(2.6rem,46px);min-height:max(1.9rem,38px);border-radius:1.3rem;cursor:pointer;opacity:.68;transition:background .15s,opacity .15s,color .15s}
  .lang-pill button.on{background:linear-gradient(135deg,#1ab4f2,#0078b8);color:#fff;opacity:1;box-shadow:0 .15rem .45rem rgba(0,133,202,.42)}

  .side-head{display:flex;align-items:center;justify-content:space-between;padding:0 .2rem}
  .side-head span{font-size:.76rem;font-weight:800;letter-spacing:.06rem;opacity:.82}
  #dots{display:flex;gap:.32rem}
  #dots i{width:1.25rem;height:.38rem;border-radius:.2rem;background:rgba(255,255,255,.18);transition:background .3s}
  #dots i.on{background:var(--cyan)}
  #cards{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,minmax(0,1fr));gap:.65rem;min-height:0;padding-top:.25rem}
  .card{position:relative;border-radius:1rem;box-sizing:border-box;padding:.22rem .35rem .30rem;cursor:pointer;touch-action:none;
        background:linear-gradient(165deg,rgba(14,45,66,.86),rgba(5,19,30,.92));border:.1rem solid rgba(118,185,224,.22);
        display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .15s,border-color .15s,opacity .15s}
  .card canvas.thumb{width:min(8.1rem,76%);aspect-ratio:1;max-height:calc(100% - 1.5rem);min-height:0;object-fit:contain;pointer-events:none}   /* never taller than its card */
  .card span.cname{font-size:.78rem;font-weight:700;margin-top:.06rem;opacity:.94;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:center}
  .card-mini{position:absolute;top:.42rem;left:.44rem;display:grid;gap:2px;pointer-events:none;opacity:.96;
             background:rgba(4,16,24,.78);padding:3.5px;border-radius:.34rem;border:1px solid rgba(255,255,255,.16);z-index:1}
  .card-mini i{display:block;width:.52rem;height:.52rem;border-radius:2px;box-sizing:border-box}
  .card-code{position:absolute;top:.42rem;right:.46rem;font-size:.72rem;font-weight:900;letter-spacing:.04rem;
             padding:.1rem .38rem;border-radius:.32rem;background:rgba(4,16,24,.72);border:1px solid rgba(255,255,255,.18);
             color:#e9f6ff;pointer-events:none;z-index:1}
  .card.sel{border-color:var(--cyan);background:linear-gradient(160deg,rgba(0,133,202,.36),rgba(41,211,255,.09));
            box-shadow:0 0 0 .16rem rgba(41,211,255,.24),inset 0 1px 0 rgba(255,255,255,.2)}
  .card.sel::after{content:attr(data-sel-label);position:absolute;top:-.55rem;left:50%;transform:translateX(-50%);background:var(--cyan);color:#04202d;
            font-size:.64rem;font-weight:900;letter-spacing:.03rem;padding:.12rem .55rem;border-radius:.3rem;white-space:nowrap}
  .card.lifted{opacity:.32;transform:scale(.94)}
  .card:active{transform:scale(.96)}

  /* active module educational strip */
  #modInfo{display:flex;align-items:flex-start;gap:.55rem;padding:.58rem .75rem;border-radius:.9rem;
           background:rgba(0,133,202,.15);border:1px solid rgba(41,211,255,.26);font-size:.74rem;line-height:1.32;color:#dff5ff}
  #modInfo i{font-style:normal;flex:none;width:1.35rem;height:1.35rem;border-radius:.4rem;background:rgba(41,211,255,.2);
             color:var(--cyan);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.76rem;margin-top:.05rem}
  #modInfo .mi-txt{display:flex;flex-direction:column;gap:.12rem;min-width:0}
  #modInfo b{font-size:.8rem;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #modInfo span{font-size:.76rem;font-weight:500;opacity:.86}

  .actions{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
  .act{height:4.2rem;border-radius:1rem;border:.1rem solid rgba(255,255,255,.18);cursor:pointer;
       background:linear-gradient(#244457,#142b38);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;
       font-size:.9rem;font-weight:800;letter-spacing:.04rem;box-shadow:0 .26rem 0 #091720,inset 0 1px 0 rgba(255,255,255,.14);transition:transform .08s}
  .act svg{width:1.55rem;height:1.55rem}
  .act:active{transform:translateY(.2rem)}
  .act.rot{background:linear-gradient(155deg,#129be0,#006ba4);border-color:rgba(41,211,255,.55)}
  .act:disabled{opacity:.35}
  body.norot #btnRot{display:none}
  body.norot .actions{grid-template-columns:1fr}

  #info{position:fixed;left:var(--gap);bottom:var(--gap);font-size:.55rem;opacity:.45;pointer-events:none;display:none}
  #fps{position:fixed;left:.5rem;bottom:2.8rem;font:600 11px/1.4 Consolas,monospace;background:rgba(0,0,0,.72);padding:4px 8px;border-radius:6px;display:none;z-index:12}
  #toast{position:fixed;left:calc((100vw - var(--side) - var(--gap) * 2) / 2);bottom:2.4rem;transform:translate(-50%,1rem);padding:.6rem 1.25rem;
         border-radius:2rem;font-weight:700;font-size:.98rem;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;z-index:8}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.bad{border-color:rgba(255,90,78,.65);color:#ffd9d6}
  #toast.good{border-color:rgba(63,226,138,.65);color:#d8ffe9}
  #toast.warn{border-color:rgba(255,194,61,.75);color:#ffefc2}

  /* flagship kiosk screens */
  #screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10}
  #screen.hidden{display:none}
  #screen.compact{justify-content:flex-end;padding-right:var(--gap);pointer-events:none;box-sizing:border-box}
  #screen.compact .panel{pointer-events:auto;width:var(--side);padding:1.3rem 1.35rem 1.1rem}
  #screen.side{justify-content:flex-end;padding:var(--gap);pointer-events:none;box-sizing:border-box}
  #screen.side .panel{pointer-events:auto;width:33rem;max-height:calc(100vh - var(--gap) * 2);overflow-y:auto;padding:1.35rem 1.52rem 1.25rem;
                      border-radius:1.65rem;display:flex;flex-direction:column}
  .panel.glass{background:rgba(7,19,28,.95);border-color:rgba(255,255,255,.12);box-shadow:0 1rem 2.6rem rgba(0,0,0,.5)}
  .panel{position:relative;overflow:hidden;width:44rem;max-width:94vw;box-sizing:border-box;padding:1.75rem 2.2rem 1.55rem;border-radius:1.1rem;text-align:center;
         animation:fadeUp .3s ease-out}
  @keyframes fadeUp{from{transform:translateY(.6rem);opacity:0}}
  @keyframes pop{from{transform:scale(.94);opacity:0}}
  .panel-top{display:flex;align-items:center;justify-content:space-between;padding-bottom:.82rem;margin-bottom:.78rem;border-bottom:1px solid rgba(255,255,255,.12)}
  .panel-brand{display:flex;align-items:center;gap:.75rem}
  .panel-brand svg{height:2.75rem;width:auto;display:block;filter:drop-shadow(0 .15rem .4rem rgba(0,0,0,.4))}
  .brand-sep{width:1px;height:1.85rem;background:linear-gradient(180deg,transparent,rgba(255,255,255,.32),transparent)}
  .brand-tag{font-size:.60rem;font-weight:900;letter-spacing:.14rem;color:#eefaff;padding:.28rem .64rem;border-radius:.55rem;
             background:linear-gradient(135deg,rgba(0,133,202,.32),rgba(236,30,54,.22));border:1px solid rgba(41,211,255,.38);text-transform:uppercase;white-space:nowrap}
  .eyebrow-pill{display:inline-flex;align-items:center;gap:.48rem;margin:0 auto .45rem;padding:.26rem .88rem;border-radius:2rem;
                background:rgba(var(--ac-rgb),.11);border:1px solid rgba(var(--ac-rgb),.32);font-size:.6rem;font-weight:800;letter-spacing:.16rem;color:#dff7ff;text-transform:uppercase}
  .eyebrow-pill i{width:.44rem;height:.44rem;border-radius:50%;background:var(--ac);box-shadow:0 0 .5rem var(--ac);display:block}
  .panel h1{margin:0 0 .38rem;font-size:1.9rem;font-weight:900;letter-spacing:.01rem;line-height:1.12;color:#fff}
  .panel p{margin:0 auto .88rem;max-width:28.5rem;font-size:.9rem;font-weight:500;color:rgba(220,242,255,.80);line-height:1.42}

  /* themed 3-world showcase selector */
  .world-lbl{display:flex;align-items:center;gap:.65rem;font-size:.62rem;font-weight:800;letter-spacing:.18rem;color:rgba(210,240,255,.78);
             text-transform:uppercase;text-align:left;margin-bottom:.46rem}
  .world-lbl::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(var(--ac-rgb),.38),transparent)}
  .world-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.46rem;margin-bottom:.68rem}
  .world-btn{position:relative;border-radius:.95rem;border:1px solid rgba(255,255,255,.11);
             background:linear-gradient(170deg,var(--wrest,rgba(18,52,74,.55)),rgba(6,20,31,.82));
             padding:.52rem .34rem .46rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.2rem;
             transition:transform .16s,border-color .16s,background .16s;overflow:hidden}
  .world-btn .w-ico{width:2.05rem;height:2.05rem;border-radius:50%;display:flex;align-items:center;justify-content:center;
                    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);transition:background .16s,border-color .16s,transform .16s}
  .world-btn svg{width:1.18rem;height:1.18rem;color:#a5d7f0;transition:color .16s}
  .world-btn b{font-size:.67rem;font-weight:800;line-height:1.15;color:#f1f9ff}
  .world-btn small{font-size:.50rem;font-weight:800;letter-spacing:.07rem;text-transform:uppercase;opacity:.76;
                   padding:.10rem .40rem;border-radius:.38rem;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);transition:background .16s,color .16s,border-color .16s}
  .world-btn[data-world=offshore]{--wc:#29d3ff;--wbg:rgba(0,133,202,.34);--wrest:rgba(14,56,82,.58)}
  .world-btn[data-world=onshore]{--wc:#3fe28a;--wbg:rgba(0,150,57,.30);--wrest:rgba(14,58,46,.52)}
  .world-btn[data-world=kacalka]{--wc:#ffc23d;--wbg:rgba(217,138,18,.30);--wrest:rgba(66,49,18,.48)}
  .world-btn[data-world=refinery]{--wc:#ff7b47;--wbg:rgba(201,74,29,.34);--wrest:rgba(68,32,24,.52)}
  .world-btn[data-world=terminal]{--wc:#5eb8ff;--wbg:rgba(26,110,196,.34);--wrest:rgba(18,46,78,.54)}
  .world-btn[data-world=green]{--wc:#2ee8b5;--wbg:rgba(15,158,120,.32);--wrest:rgba(14,60,54,.52)}
  .world-btn.on{transform:translateY(-2px);border-color:var(--wc);background:linear-gradient(160deg,var(--wbg),rgba(6,22,34,.92));
                box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 .45rem 1.2rem rgba(0,0,0,.38)}
  .world-btn.on::before{content:'';position:absolute;left:18%;right:18%;bottom:0;height:2.5px;border-radius:2px 2px 0 0;background:var(--wc);box-shadow:0 0 .6rem var(--wc)}
  .world-btn.on::after{content:'';position:absolute;top:.46rem;right:.46rem;width:.42rem;height:.42rem;border-radius:50%;background:var(--wc)}
  .world-btn.on .w-ico{background:rgba(255,255,255,.14);border-color:var(--wc);transform:scale(1.06)}
  .world-btn.on svg{color:var(--wc)}
  .world-btn.on small{opacity:1;color:var(--wc);background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.16)}
  .world-btn:active{transform:scale(.97)}

  /* connected 3-step timeline strip */
  .steps-bar{display:flex;align-items:center;justify-content:space-between;gap:.2rem;padding:.62rem .78rem;margin-bottom:.82rem;
             border-radius:1.05rem;background:linear-gradient(180deg,rgba(255,255,255,.048),rgba(255,255,255,.018));border:1px solid rgba(255,255,255,.09)}

const TYPE_W = { I3: 0.7, I4: 0.8, O: 0.7, T: 1.2, L: 1.2, J: 1.2, S: 1, Z: 1, V: 0.6 };

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function normalize(cells) {
  let mx = Infinity, my = Infinity;
  for (const [x, y] of cells) { if (x < mx) mx = x; if (y < my) my = y; }
  return cells.map(([x, y]) => [x - mx, y - my]).sort((a, b) => a[1] - b[1] || a[0] - b[0]);
}
function rot90(cells) { return normalize(cells.map(([x, y]) => [-y, x])); }
const ROTS = {};
for (const k in SHAPES) {
  const list = [], seen = new Set();
  let c = normalize(SHAPES[k].cells);
  for (let i = 0; i < 4; i++) {
    const key = JSON.stringify(c);
    if (!seen.has(key)) { seen.add(key); list.push(c); }
    c = rot90(c);
  }
  ROTS[k] = list;
}

function pickType(rng, counts) {
  const opts = []; let total = 0;
  for (const k in TYPE_W) { if ((counts[k] || 0) >= 2) continue; opts.push(k); total += TYPE_W[k]; }
  let r = rng() * total;
  for (const k of opts) { r -= TYPE_W[k]; if (r <= 0) return k; }
  return opts[opts.length - 1];
}

function countSolutions(hole, N, types, cap = 500) {
  const cells = Uint8Array.from(hole);
  const used = new Array(types.length).fill(false);
  let count = 0;
  function rec(start) {
    if (count >= cap) return;
    let idx = start;
    while (idx < N * N && !cells[idx]) idx++;
    if (idx >= N * N) { count++; return; }
    const cx = idx % N, cy = (idx / N) | 0;
    const tried = new Set();
    for (let i = 0; i < types.length; i++) {
      if (used[i] || tried.has(types[i])) continue;
      tried.add(types[i]);
      for (const rc of ROTS[types[i]]) {
        const ox = cx - rc[0][0], oy = cy - rc[0][1];
        let ok = true;
        for (const [x, y] of rc) {
          const X = ox + x, Y = oy + y;
          if (X < 0 || Y < 0 || X >= N || Y >= N || !cells[Y * N + X]) { ok = false; break; }
        }
        if (!ok) continue;
        for (const [x, y] of rc) cells[(oy + y) * N + ox + x] = 0;
        used[i] = true;
        rec(idx);
        used[i] = false;
        for (const [x, y] of rc) cells[(oy + y) * N + ox + x] = 1;
        if (count >= cap) return;
      }
    }
  }
  rec(0);
  return count;
}

const DIFFICULTY = { pieces: 5, minArea: 18, maxArea: 20, maxSolutions: 6 };
// single standard difficulty (flat for every visitor): 5 modules, 60 s
const TIERS = {
  engineer: { pieces: 5, minArea: 18, maxArea: 20, maxSolutions: 6,  time: 60 },
};

function generate(seed, opt = {}) {
  const D = { ...DIFFICULTY, ...opt };
  const N = opt.size || 8, minP = D.pieces, maxP = D.pieces;
  const rng = mulberry32(seed >>> 0);
  for (let attempt = 0; attempt < 500; attempt++) {
    const count = minP + Math.floor(rng() * (maxP - minP + 1));
    const hole = new Uint8Array(N * N);
    const solution = [], counts = {};
    let failed = false;
    for (let p = 0; p < count && !failed; p++) {
      let done = false;
      for (let t = 0; t < 20 && !done; t++) {
        const type = pickType(rng, counts);
        const rots = ROTS[type], rot = Math.floor(rng() * rots.length), cells = rots[rot];
        let w = 0, h = 0;
        for (const [x, y] of cells) { if (x + 1 > w) w = x + 1; if (y + 1 > h) h = y + 1; }
        const cands = []; let total = 0;
        for (let oy = 0; oy <= N - h; oy++) for (let ox = 0; ox <= N - w; ox++) {
          let ok = true, contact = 0, edge = 0;
          for (const [cx, cy] of cells) {
            const x = ox + cx, y = oy + cy;
            if (hole[y * N + x]) { ok = false; break; }
            if (x === 0 || y === 0 || x === N - 1 || y === N - 1) edge++;
            if (x > 0 && hole[y * N + x - 1]) contact++;
            if (x < N - 1 && hole[y * N + x + 1]) contact++;
            if (y > 0 && hole[(y - 1) * N + x]) contact++;
            if (y < N - 1 && hole[(y + 1) * N + x]) contact++;
          }
          if (!ok) continue;
          let wgt;
          if (p === 0) {
            const d = Math.abs(ox + w / 2 - N / 2) + Math.abs(oy + h / 2 - N / 2);
            wgt = Math.max(0.05, 1 - d / 4);
          } else {
            if (!contact) continue;
            wgt = contact;
          }
          if (edge) wgt *= 0.2;
          cands.push([ox, oy, wgt]); total += wgt;
        }
        if (!cands.length) continue;
        let r = rng() * total, pick = cands[cands.length - 1];
        for (const c of cands) { r -= c[2]; if (r <= 0) { pick = c; break; } }
        for (const [cx, cy] of cells) hole[(pick[1] + cy) * N + pick[0] + cx] = 1;
        solution.push({ type, rot, x: pick[0], y: pick[1] });
        counts[type] = (counts[type] || 0) + 1;
        done = true;
      }
      if (!done) failed = true;
    }
    if (failed) continue;
    const area = hole.reduce((a, b) => a + b, 0);
    if (area < D.minArea || area > D.maxArea) continue;
    const types = solution.map(s => s.type);
    const solutions = countSolutions(hole, N, types, D.maxSolutions + 1);
    if (solutions > D.maxSolutions) continue;
    const tray = types.map((type, id) => ({ id, type }));
    for (let i = tray.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [tray[i], tray[j]] = [tray[j], tray[i]]; }
    return { seed: seed >>> 0, size: N, hole, solution, tray, solutions };
  }
  throw new Error('generation failed for seed ' + seed);
}

function signature(level) {
  return Array.from(level.hole).join('') + ':' + level.solution.map(s => s.type).sort().join(',');
}

function applyKitPlatform() {
  for (const id in SCENES) {

    if (terr) terr.traverse(m => { if (m.isMesh) m.userData.noCast = true; });
    const live = [];
    copy.traverse(o => {
      // direct children of the base root only: GLTFLoader names a multi-material node's primitive meshes
      // `<mesh>_0`, `_1`..., which would otherwise match `pumpjack_beam_N` and be torn out of their node
      if (o.parent === copy && (/^pumpjack_(beam|crank)(_\d+)?$/.test(o.name) || /^turbine_rotor_\d+$/.test(o.name))) {
        live.push(o);
      }
    });
    for (const o of live) o.parent.remove(o);
    ENV[id].add(bakeStatic(copy));
    if (live.length) {
      SCENES[id].anim = live.map(o => {
        ENV[id].add(o);
        const k = +(o.name.match(/_(\d+)$/) || [0, 1])[1];   // beam_N and crank_N share a phase; units nod out of sync
        return { o, rest: o.quaternion.clone(), crank: /^pumpjack_crank/.test(o.name), spin: /^turbine_rotor_\d+$/.test(o.name), ph: (k - 1) * 2.3 };
      });
    }
    const hs = base.getObjectByName('heli_spot');
    if (hs) { base.updateMatrixWorld(true); SCENES[id].heliSpot = hs.getWorldPosition(new THREE.Vector3()); }
  }
  dirtyShadows();
}

function syncHoles() {
  let cnt = 0;
  for (let i = 0; i < N * N; i++) {
    if (!holeOpen[i] || !holeVis[i]) continue;
    holeDummy.position.copy(cellPos(i % N, (i / N) | 0));

function makePiece(type, cells, kind, r = 0) {

const BUILD_COLORS = [0x7a5242, 0x8a8170, 0x5f666c, 0x93979b, 0x6b6050, 0x58605a, 0x7c5648];
function shuffle(a, rng) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function hidesHole(hole, x0, y0, w, rows) {
  for (let x = x0; x < x0 + w; x++) for (let y = y0 - 1; y >= Math.max(0, y0 - rows); y--) if (hole[y * N + x]) return true;
  return false;
}
function maxHeightAt(hole, x0, y0, w, h) {
  let maxH = (y0 + h === N) ? 1.25 : 1.75;
  if (hidesHole(hole, x0, y0, w, 1)) maxH = Math.min(maxH, 0.55);
  else if (hidesHole(hole, x0, y0, w, 2)) maxH = Math.min(maxH, 1.05);
  return maxH;
}

function buildDecor(level, group) {
  const rng = mulberry32((level.seed ^ 0x9e3779b9) >>> 0);
  const used = Uint8Array.from(level.hole);
  const order = shuffle([...Array(N * N).keys()], rng);
  const bigSizes = [[3, 2], [2, 3], [2, 2], [3, 1], [1, 3], [2, 1], [1, 2]];
  const st = { derrick: false, heli: false, heliPos: null, counts: {}, placed: [] };
  for (const idx of order) {
    if (used[idx]) continue;
    const x0 = idx % N, y0 = (idx / N) | 0;
    let rect = [1, 1];
    for (const [w, h] of shuffle(bigSizes.slice(), rng)) {
      if (x0 + w > N || y0 + h > N) continue;
      if ((w === 3 && h === 2 || w === 2 && h === 3) && maxHeightAt(level.hole, x0, y0, w, h) < 1.55) continue;
      let ok = true;
      for (let y = y0; y < y0 + h && ok; y++) for (let x = x0; x < x0 + w; x++) if (used[y * N + x]) { ok = false; break; }
      if (ok) { rect = [w, h]; break; }
    }
    for (let y = y0; y < y0 + rect[1]; y++) for (let x = x0; x < x0 + rect[0]; x++) used[y * N + x] = 1;
    makeStructure(group, level.hole, x0, y0, rect[0], rect[1], rng, st);
  }
  return st;
}

const KIT_BUILDINGS = {
  '1x1': ['bld_1x1_a', 'bld_1x1_b', 'bld_1x1_c', 'bld_1x1_d', 'bld_1x1_e', 'bld_1x1_f'],
  '2x1': ['bld_2x1_a', 'bld_2x1_b', 'bld_2x1_c', 'bld_2x1_d'],
  '3x1': ['bld_3x1_a', 'bld_3x1_b', 'bld_3x1_c', 'bld_3x1_d'],
  '2x2': ['bld_2x2_a', 'bld_2x2_b', 'bld_2x2_c', 'bld_2x2_d', 'bld_2x2_e', 'bld_2x2_f'],
  '3x2': ['bld_3x2_a'],
  '2x3': ['bld_2x3_a'],
};
const DECOR_TINTS = [0x8fa8b8, 0xc8b48a, 0x8ea696, 0xb88c7a, 0x9aa4ad, 0x7c92a6];
const decorLiveryCache = new Map();
function getDecorLivery(origMat, tintIdx) {
  const k = origMat.uuid + ':' + tintIdx;
  if (!decorLiveryCache.has(k)) {
    const c = origMat.clone();
    c.name = origMat.name;

function outwardQuarters(x0, y0, w, h) {
  const qs = [];
  if (x0 + w === N) qs.push(0); // +X sea edge
  if (y0 === 0) qs.push(1);     // -Z far edge
  if (x0 === 0) qs.push(2);     // -X sea edge
  if (y0 + h === N) qs.push(3); // +Z near edge
  return qs;
}

function kitBuilding(g, hole, x0, y0, w, h, maxH, rng, st) {
  const derrickOk = !st.derrick && y0 <= 2 && !hidesHole(hole, x0, y0, w, N);
  const onPerimeter = x0 === 0 || x0 + w === N || y0 === 0 || y0 + h === N;
  const outQs = outwardQuarters(x0, y0, w, h);
  const cands = [];
  const add = (key, qs) => {
    for (const n of KIT_BUILDINGS[key] || []) {
      if (!KIT[n]) continue;
      if (n === 'bld_2x2_d' && !derrickOk) continue;
      if (n === 'bld_2x2_c' && (st.heli || !onPerimeter)) continue;
      if (n === 'bld_2x3_a' && !onPerimeter) continue;
      if (n === 'bld_1x1_b' && !onPerimeter) continue;
      for (const q of qs) {
        if ((n === 'bld_2x3_a' || n === 'bld_1x1_b') && !outQs.includes(q)) continue;
        cands.push([n, q]);

    }
  };
  if (w === h) add(`${w}x${h}`, [0, 1, 2, 3]);
  else { add(`${w}x${h}`, [0, 2]); add(`${h}x${w}`, [1, 3]); }
  if (!cands.length) return false;
  let pick = cands.find(c => c[0] === 'bld_2x2_d' && rng() < 0.65);
  if (!pick) {
    let fit = cands.filter(c => c[0] !== 'bld_2x2_d' && KIT[c[0]].userData.h <= maxH + 0.05);
    if (!fit.length) return false;
    const x1 = x0 + w - 1, y1 = y0 + h - 1;
    const nearbyNames = new Set(
      st.placed
        .filter(p => Math.max(0, p.x0 - (x1 + 1), x0 - (p.x1 + 1)) <= 1 && Math.max(0, p.y0 - (y1 + 1), y0 - (p.y1 + 1)) <= 1)
        .map(p => p.name)

    const nonAdj = fit.filter(c => !nearbyNames.has(c[0]));
    if (nonAdj.length) fit = nonAdj;
    let minCnt = Infinity;
    for (const c of fit) minCnt = Math.min(minCnt, st.counts[c[0]] || 0);
    const balanced = fit.filter(c => (st.counts[c[0]] || 0) === minCnt);
    pick = balanced[Math.floor(rng() * balanced.length)];

  const [name, q] = pick;
  st.counts[name] = (st.counts[name] || 0) + 1;

  const m = KIT[name].clone();
  const tintIdx = Math.floor(rng() * DECOR_TINTS.length);
  m.traverse(o => {
    if (!o.isMesh || !o.material) return;
    const mapMat = mt => (mt.name === 'b2_clad' || mt.name === 'b2_offwhite') ? getDecorLivery(mt, tintIdx) : mt;
    o.material = Array.isArray(o.material) ? o.material.map(mapMat) : mapMat(o.material);

  return true;
}

function makeStructure(group, hole, x0, y0, w, h, rng, st) {
  const g = new THREE.Group();
  const c = cellPos(x0 + (w - 1) / 2, y0 + (h - 1) / 2);
  g.position.copy(c);
  g.position.y = 0; // flush with deck y=0
  group.add(g);

  if (KIT && kitBuilding(g, hole, x0, y0, w, h, maxH, rng, st)) return;
  const col = () => BUILD_COLORS[Math.floor(rng() * BUILD_COLORS.length)];
  const W = w - 0.1, D = h - 0.1;

  if (w === 2 && h === 2 && !st.derrick && y0 <= 2 && !hidesHole(hole, x0, y0, w, N) && r < 0.6) {
    st.derrick = true;

    const tower = new THREE.Mesh(new THREE.ConeGeometry(0.75, 3.2, 4, 6, true), new THREE.MeshBasicMaterial({ color: 0xd94a3a, wireframe: true }));

    addMesh(g, new THREE.BoxGeometry(0.1, 0.02, 0.8), mat(0xffffff, 0.5, 0), 0.25, 0.13, 0, false);
    addMesh(g, new THREE.BoxGeometry(0.5, 0.02, 0.1), mat(0xffffff, 0.5, 0), 0, 0.13, 0, false);
    return;
  }
  const h1 = Math.min(maxH, 0.28 + rng() * 0.2);
  const c1 = col();
  addMesh(g, new THREE.BoxGeometry(W, h1, D), mat(c1), 0, h1 / 2, 0);
  addMesh(g, new THREE.BoxGeometry(W + 0.02, 0.05, D + 0.02), mat(new THREE.Color(c1).multiplyScalar(0.6).getHex()), 0, h1 * 0.55, 0);
}

// Flush offshore construction bay frame: hazard coaming curbs + convex corner alignment beacons
const CURB_X = new THREE.BoxGeometry(1.0, 0.032, 0.048);

function loadLeaderboard() {

      if (legacyKey) {
        rawStr = localStorage.getItem(legacyKey);
        if (rawStr) localStorage.setItem(LB_KEY, rawStr);

    }
    const raw = JSON.parse(rawStr || '{}');

  } catch { return { cadet: [], engineer: [], chief: [] }; }
}

}

function addLeaderboardEntry(tier, rawName, elapsed, stars) {
  const clean = String(rawName || '').trim().replace(/\s+/g, ' ').slice(0, 18);

function generateUnique() {
  const tierOpt = TIERS[activeTier];
  if (fixedSeed !== null) return generate(fixedSeed, tierOpt);
  const seen = loadSeen(), set = new Set(seen);
  let lvl;
  for (let i = 0; i < 50; i++) {
    lvl = generate((Math.random() * 2 ** 32) >>> 0, tierOpt);
    if (!set.has(activeTier + ':' + signature(lvl))) break;
  }
  seen.push(activeTier + ':' + signature(lvl)); saveSeen(seen);
  return lvl;
}

function newRound(opt = {}) {
  if (!opt.keepScreen && lbModalOpen()) closeLbModal();
  clearPower(); demoReset();
  disposeGroup(levelGroup);
  if (ghost) { scene.remove(ghost); ghost = null; }
  heli.visible = false; heli.userData.active = false;
  beaconLensMat.emissive.setHex(0x29d3ff);
  tagSaved = false; playerName = ''; lastSavedTs = 0; combo = 0; lastPlaceTs = 0;
  {
    const forced = params0.get('scene');
    const pool = worldPool();
    let next = 'platform';
    if (opt.scene && sceneReady(opt.scene)) next = opt.scene;
    else if (forced && sceneReady(forced)) next = forced;
    else if (opt.advanceScene && pool.length) {
      const idx = pool.indexOf(selectedScene);
      next = pool[(idx + 1) % pool.length];
    } else if (sceneReady(selectedScene)) next = selectedScene;
    else if (pool.length) next = pool[0];
    selectedScene = next;
    setScene(next);
  }
  level = generateUnique();
  const decor = new THREE.Group();
  buildBayFrame(level.hole, decor);
  const decorState = buildDecor(level, decor);
  currentHeliPos = decorState.heliPos || (SCENES[sceneId].heliSpot ? SCENES[sceneId].heliSpot.clone() : null);
  levelGroup.add(bakeStatic(decor));
  disposeGroup(decor);
  dirtyShadows();
  for (let i = 0; i < N * N; i++) {
    holeOpen[i] = level.hole[i] ? 1 : 0;
    holeVis[i] = holeOpen[i];
    holeDead[i] = 0;
  }
  syncHoles();
  hintGroup = new THREE.Group(); hintGroup.visible = false; levelGroup.add(hintGroup);
  for (const s of level.solution) {
    const p = makePiece(s.type, ROTS[s.type][s.rot], 'hint', s.rot);
    p.position.copy(cellPos(s.x, s.y)); p.userData.body.position.y = 0.02;
    hintGroup.add(p);
  }
  tray = level.tray.map(t => ({ ...t, placed: false, rot: LOCK_ROT ? level.solution[t.id].rot : 0 }));
  placed = []; occ = new Int16Array(N * N).fill(-1);
  sel = 0; rot = tray[0] ? tray[0].rot : 0; ghostArmed = false; hintUsed = false; hintTimer = 0; ghostSpin = 0; ghostPop = 0;
  let best = 0, bd = 1e9;
  for (let i = 0; i < N * N; i++) if (level.hole[i]) { const d = Math.abs(i % N - 3.5) + Math.abs(((i / N) | 0) - 3.5); if (d < bd) { bd = d; best = i; } }
  cursor = { x: best % N, y: (best / N) | 0 };
  timeLeft = roundDuration();
  if (!opt.keepOrbit) camOrbit = 0;
  placeCamera();
  if (!opt.keepScreen || status === 'ready') setStatus('ready');
  updateWorldUI();
  updateAmbientTone();
  renderTray(); rebuildGhost(); updateTimer();
  $('info').textContent = `scene=${sceneId} · seed=${level.seed} · blocks=${tray.length} · sols=${level.solutions}`;
}

function pickWorld(id) {
  if (!sceneReady(id) || id === sceneId) return;
  attractTimer = 0;
  newRound({ scene: id, keepScreen: true, keepOrbit: true });
  sfx('select', () => beep(540, 0.05, 'triangle', 0.07));
}

function disposeGroup(g) {
  g.traverse(o => { if (o.geometry && !o.geometry.userData.shared) o.geometry.dispose(); });
  g.clear();
}

  const key = camSideCur * 10000 + camBotCur;

  lastCamOffset = key;
  camera.setViewOffset(w, h, camSideCur / 2, camBotCur / 2, w, h);
  viewAspect = (w - camSideCur) / h;
  camBotFrac = camBotCur / h;
  camera.updateProjectionMatrix();
  return true;
}
function applyQuality() {
  const q = QUALITY[qLevel];
  sun.castShadow = q.shadows;
  if (sun.shadow.mapSize.x !== q.shadowSize) {
    sun.shadow.mapSize.set(q.shadowSize, q.shadowSize);
    if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
  }
  dirtyShadows();
  resize();
}
function resize() {
  const w = innerWidth, h = innerHeight, q = QUALITY[qLevel];
  const pr = Math.max(1.0, Math.min(devicePixelRatio, q.prCap, Math.sqrt(q.maxPixels / (w * h))));
  renderer.setPixelRatio(pr);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  lastCamOffset = -1;
  applyCamViewOffset();
  placeCamera();
  dock.slots = null;
}
addEventListener('resize', resize);
// mobile browsers: never let the page zoom (pinch / double-tap / rotation keep-zoom)
(() => {
  const meta = document.querySelector('meta[name=viewport]');
  const resetZoom = () => {
    if (!window.visualViewport || visualViewport.scale <= 1.01) return;
    const c = meta.content; meta.content = c + ',minimum-scale=1'; setTimeout(() => { meta.content = c; }, 60);
  };
  const later = () => { resize(); resetZoom(); setTimeout(() => { resize(); resetZoom(); }, 350); };
  addEventListener('orientationchange', later);
  document.addEventListener('fullscreenchange', later);
  if (window.visualViewport) visualViewport.addEventListener('resize', () => { resetZoom(); resize(); });
  document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  let lastEnd = 0;
  document.addEventListener('touchend', e => {
    const now = performance.now();
    if (now - lastEnd < 350 && !e.target.closest('button,input')) e.preventDefault();
    lastEnd = now;
  }, { passive: false });
  document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
})();
applyQuality();

const perf = { acc: 0, n: 0, since: 0, fps: 0, ms: 0, lowStreak: 0, highStreak: 0, show: params0.has('fps') };
function trackPerf(rawMs, now) {
  if (document.visibilityState !== 'visible' || rawMs > 250 || !bootReadyAt) return;
  perf.acc += rawMs; perf.n++;
  if (now - perf.since < 2500) return;
  perf.ms = perf.acc / perf.n; perf.fps = 1000 / perf.ms;
  if (now - bootReadyAt > 5000 && !params0.has('q') && !qLocked) {
    // Step down below 50 fps (40-56 fps used to be a dead zone that never adapted and stayed choppy). Never step
    // back up to a level that already failed: every switch reallocates buffers, and ping-pong caused hitches.
    if (perf.fps < 50) {
      perf.lowStreak++; perf.highStreak = 0;
      if (perf.lowStreak >= 2 && qLevel < QUALITY.length - 1) { perf.floor = Math.max(perf.floor || 0, qLevel + 1); qLevel++; perf.lowStreak = 0; applyQuality(); }
    } else if (perf.fps >= 58) {
      perf.highStreak++; perf.lowStreak = 0;
      if (perf.highStreak >= 3 && qLevel > (perf.floor || 0)) { qLevel--; perf.highStreak = 0; applyQuality(); }
    } else {
      perf.lowStreak = 0; perf.highStreak = 0;
    }
  }
  if (perf.show) {
    const el = $('fps'); el.style.display = 'block';
    el.textContent = `${perf.fps.toFixed(0)} fps · ${perf.ms.toFixed(1)} ms · q${qLevel} · ${renderer.info.render.calls} calls · ${(renderer.info.render.triangles / 1000).toFixed(1)}k tris · ${gpuLabel} · pr ${renderer.getPixelRatio().toFixed(2)}`;
  }
  perf.acc = 0; perf.n = 0; perf.since = now;
}
addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (e.code === 'KeyF') { perf.show = !perf.show; $('fps').style.display = perf.show ? 'block' : 'none'; }
});

let last = performance.now(), T = 0, steamAccum = 0, orbitHold = null;   // orbitHold: debug camera freeze (screenshots)
function loop(now) {
  renderer.info.reset();
  const rawMs = now - last;
  const dt = Math.min(0.05, rawMs / 1000); last = now; T += dt;
  pollPad(dt);
  skyUniforms.uTime.value = T;
  animWater(T);
  surround(T, status === 'celebrating' ? 1.65 : 1);
  if (SCENES[sceneId].anim) {
    const th = T * 1.6;
    for (const a of SCENES[sceneId].anim) {
      a.o.quaternion.copy(a.rest);
      a.o.rotateZ(a.spin ? T * 1.45 + a.ph : a.crank ? -(th + a.ph) : -0.2 * Math.sin(th + a.ph));
    }
  }
  if (status === 'play') {
    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; lose(); }
    updateTimer();
  } else if (status === 'celebrating') {
    celebT += dt;
    updatePower(celebT);
    if (celebT >= celebDur) setStatus('win');
  }
  const targetMix = status === 'celebrating' ? 1 : 0;
  const targetReady = status === 'ready' ? 1 : 0;
  if (Math.abs(celebCamMix - targetMix) > 0.001 || Math.abs(readyCamMix - targetReady) > 0.001) {
    celebCamMix += (targetMix - celebCamMix) * Math.min(1, dt * 4.5);
    readyCamMix += (targetReady - readyCamMix) * Math.min(1, dt * (targetReady ? 5.0 : 2.0));   // slow lift-off on START
    placeCamera();
  }
  if (applyCamViewOffset(dt)) placeCamera();
  if (camPunch > 0.001) {
    camPunch *= Math.exp(-dt * 12);
    placeCamera();
  }
  holeMat.opacity = 0.78 + 0.22 * Math.sin(T * 3);
  beaconLensMat.emissiveIntensity = 1.6 + 0.9 * Math.sin(T * 3.5);

  if (placed && placed.length && (status === 'play' || status === 'celebrating' || status === 'win')) {
    steamAccum += dt;
    if (steamAccum > 0.72) {
      steamAccum = 0;
      const p = placed[Math.floor(Math.random() * placed.length)];
      const [cx, cy] = p.cells[Math.floor(Math.random() * p.cells.length)];
      const wp = cellPos(p.x + cx, p.y + cy);
      spawnParticle(wp.x + (Math.random() - 0.5) * 0.25, 0.58, wp.z + (Math.random() - 0.5) * 0.25, (Math.random() - 0.5) * 0.14, 0.55 + Math.random() * 0.25, (Math.random() - 0.5) * 0.14, 1.35, 1.15, 0xe8f6ff, -0.25);
    }
  }
  updateEffects(dt);

  if (status === 'celebrating') { camOrbit += dt * 0.30; placeCamera(); }
  else if (status === 'win' && !orbitDrag) { camOrbit += dt * 0.075; placeCamera(); }
  else if (status === 'ready' && !orbitDrag && orbitHold === null) { camOrbit += dt * 0.042; placeCamera(); }

  if (heli.visible && heli.userData.active) {
    const hd = heli.userData;
    hd.t = Math.min(1, hd.t + dt / 2.8);
    const s = hd.t * hd.t * (3 - 2 * hd.t);
    heli.position.lerpVectors(hd.start, hd.target, s);
    if (hd.mode === 'hover' && hd.t >= 1) heli.position.y = hd.target.y + Math.sin(T * 2.2) * 0.14;
    if (hd.mode === 'land' && hd.t >= 1) heli.rotation.set(0, 0.35, 0);
    else heli.rotation.set((1 - s) * 0.16, THREE.MathUtils.lerp(-0.9, 0.35, s), (1 - s) * 0.08);
    hd.rotor.rotation.y += dt * 26;
    hd.tailRot.rotation.x += dt * 36;
  }
  tickExpo(now, dt); tickDemo(dt);
  if (status === 'lose') hintMat.opacity = 0.35 + 0.2 * Math.sin(T * 4);
  if (status === 'win' && power) updatePower(1e6, true);   // finish instantly if the sequence was skipped; keep seams pulsing
  if (status === 'win' || status === 'lose') {
    const typing = document.activeElement && document.activeElement.tagName === 'INPUT';
    if ($('pwdModal').classList.contains('show') || typing) endTime = now;
    const left = AUTO_RESTART - (now - endTime) / 1000, cd = $('cd');
    if (cd) cd.textContent = Math.max(0, Math.ceil(left));
    if (left <= 0) newRound({ advanceScene: true });
  }
  if (ghost && current()) {
    const o = ghostOrigin(), target = cellPos(o.x, o.y);
    ghost.position.lerp(target, Math.min(1, dt * 18));
    if (shake > 0) { shake -= dt; ghost.position.x += Math.sin(T * 60) * 0.08 * (shake / 0.35); }
    ghost.userData.body.position.y = 0.45 + Math.sin(T * 4) * 0.06;
    if (ghost.userData.pivot) {
      ghostSpin *= Math.exp(-dt * 18);
      ghostPop *= Math.exp(-dt * 14);
      ghost.userData.pivot.rotation.y = ghostSpin;
      ghost.userData.pivot.scale.setScalar(1 + 0.11 * ghostPop);
    }
    ghost.visible = (status === 'play') && ghostArmed && !(drag && drag.moved && !drag.over);
  }
  for (const p of placed) {
    const ud = p.mesh.userData;
    if (ud.drop > 0 || ud.bounce !== undefined) dirtyShadows(1);
    if (ud.drop > 0) {
      ud.drop = Math.max(0, ud.drop - dt * 5.2);
      const t = 1 - ud.drop;
      const spring = t < 0.7 ? Math.pow(1 - t / 0.7, 2) * 1.15 : -Math.sin(((t - 0.7) / 0.3) * Math.PI) * 0.09;
      p.mesh.userData.body.position.y = Math.max(0, spring);
    }
    if (ud.bounce !== undefined) {
      ud.bounce += dt * 2.2;
      const b = ud.bounce;
      p.mesh.userData.body.position.y = b > 0 && b < 1 ? Math.sin(b * Math.PI) * 0.5 : 0;
      if (b >= 1) delete ud.bounce;
    }
  }
  if (shadowFrames > 0) { renderer.shadowMap.needsUpdate = true; shadowFrames--; }
  renderer.render(scene, camera);
  if (updateDock(dt)) { renderer.autoClear = false; renderer.render(dock.bg, dock.cam); renderer.clearDepth(); renderer.render(dock.scene, dock.cam); renderer.autoClear = true; }
  trackPerf(rawMs, now);
  requestAnimationFrame(loop);
}

window.__game = {
  get status() { return status; }, get level() { return level; }, get placed() { return placed.length; },
  get tier() { return activeTier; }, get lang() { return lang; }, get sceneId() { return sceneId; },
  start() { if (status === 'ready') confirm(); },
  setTier(k) { if (TIERS[k]) { activeTier = k; newRound({ keepScreen: status === 'ready' }); } },
  setLang,
  pickWorld,
  autoSolve(steps = Infinity) {
    for (const s of level.solution) {
      if (steps-- <= 0) break;
      const t = tray.find(t => t.id === level.solution.indexOf(s));
      if (t.placed) continue;
      selectId(t.id); rot = s.rot;
      const a = anchorOf(ROTS[s.type][s.rot]);
      cursor = { x: s.x + a[0], y: s.y + a[1] };
      rebuildGhost(); place();
    }
  },
  newRound, setTime(v) { timeLeft = v; },
  dbg: { THREE, ROTS, scene, renderer, camera, dock, waterMat, sfxBuf, THUMB_CACHE, heli, perf,
    holdOrbit(v) { orbitHold = v; if (v !== null) { camOrbit = v; placeCamera(); } } },
};

await loadKit();
KIT = KITS.platform || null;
applyKitPlatform();
applyKitMarine();
// Warm-up behind the loader so the stand never hitches later: one batched thumbnail readback per world, and one
// render of every world to compile its shaders and upload its meshes before the first world switch.
for (const id of Object.keys(SCENES)) {
  if (!sceneReady(id)) continue;
  const jobs = [];
  for (const type of Object.keys(SHAPES)) for (let r = 0; r < ROTS[type].length; r++) jobs.push([id, type, r]);
  try { bakeThumbs(jobs); } catch (e) { console.warn('thumb bake', id, e); }
  if (SCENES[id].hidden) continue;
  try { setScene(id); renderer.render(scene, camera); } catch (e) { console.warn('warm', id, e); }
}
dirtyShadows();
setLoadProgress(100);
if (params0.has('lbdemo')) fillDemoLeaderboard();
newRound();
applyLangUI();
bootReadyAt = performance.now();
setTimeout(() => { const ld = $('loader'); if (ld) { ld.classList.add('done'); setTimeout(() => { ld.style.display = 'none'; }, 480); } }, 120);
requestAnimationFrame(loop);
</script>
